<style>
:root{--bg:#121212;--card:#1d1d1d;--line:#333;--tx:#eee;--mu:#999;--g:#e0a912;--g2:#ffd966}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
header{padding:22px 16px 10px;text-align:center;background:linear-gradient(#2a2208,var(--bg))}
h1{margin:0;color:var(--g2);letter-spacing:2px;font-size:clamp(22px,5vw,38px)}header p{margin:4px;color:var(--mu)}.logo{display:block;margin:0 auto 6px;height:clamp(70px,16vw,110px);width:auto}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button,select{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--g);color:#000;border-color:var(--g);font-weight:700}
main{max-width:1100px;margin:auto;padding:12px}.demo{background:#5a1d1d;text-align:center;padding:6px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
h2{color:var(--g);margin:0 0 10px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.rec small{color:var(--mu)}.rec b{display:block;font-size:22px;color:var(--g2)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--g);cursor:pointer;position:sticky;top:0;background:var(--card)}td.l,th.l{text-align:left}
tr.p1 td{background:#3d3208}tr.p2 td{background:#2b2b2b}tr.p3 td{background:#3a2412}a{color:var(--g2);cursor:pointer;text-decoration:underline dotted}
.crest{width:1.6em;height:1.6em;margin-right:6px;vertical-align:-.45em}.crestbig{width:56px;height:56px;vertical-align:middle;margin-right:8px}.ic{width:1.3em;height:1.3em;object-fit:contain;vertical-align:-.25em;border-radius:4px}.bar{fill:var(--g)}svg text{fill:var(--mu);font-size:9px}.lg span{margin-right:12px;font-size:12px}details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer}
input{background:#111;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit}.k{width:72px;text-align:center}.bt{background:var(--g);color:#000;border:0;padding:8px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.bt.r{background:#a33;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.ok{background:#1d3d1d;text-align:center;padding:8px;border-radius:8px;margin:8px 0}
.match{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.match.vivo{border-color:#d33;box-shadow:0 0 0 1px #d33 inset}.mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-bottom:8px}.mb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.pt{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}.pt.r{flex-direction:row-reverse;text-align:right}.sc{font-size:clamp(24px,6vw,38px);font-weight:800;color:var(--g2);white-space:nowrap}.mn{text-align:center;color:var(--mu);font-size:13px;margin-top:6px}.st{font-weight:700;font-size:11px;padding:2px 8px;border-radius:99px;background:#333;color:#ccc}.st.vivo{background:#d33;color:#fff}.st.final{background:#1d3d1d;color:#9f9}.st.cancelada{background:#4a1d1d;color:#f99}.st.retrasada{background:#4a3a10;color:#fc6}.st.pendiente{background:#333;color:#ccc}.cx{opacity:.55}.cx td{text-decoration:line-through}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:5px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}.mw{color:var(--g2)}

.shell{display:flex;align-items:flex-start;max-width:1380px;margin:auto}.content{flex:1;min-width:0}
#side{width:220px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 8px;border-right:1px solid var(--line)}
#side nav{display:flex;flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;position:static;padding:0;gap:4px}
#side nav button{text-align:left;width:100%}
#menub{display:none}
#sbox{position:relative;max-width:520px;margin:10px auto 0;padding:0 12px;z-index:6}#sq{width:100%;padding:10px 12px;border-radius:8px}#sres{position:absolute;left:12px;right:12px;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow-y:auto;box-shadow:0 8px 24px #000a}#sres[hidden]{display:none}.sri{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.sri:hover{background:#2b2b2b}.sri small{color:var(--g);margin-right:6px}
@media(max-width:800px){.shell{display:block}#menub{display:block;position:sticky;top:0;z-index:7;width:100%;border-radius:0;padding:10px}
#side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:9;background:var(--bg);transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}}

/* ===== FX estilo Minecraft: partículas, títulos, actionbar, logros, barra de XP ===== */
body{padding-bottom:56px}
.logo{cursor:pointer;animation:fxbob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 10px #e0a91255)}@keyframes fxbob{50%{transform:translateY(-6px) rotate(-2deg)}}
.bt,nav button{transition:transform .08s,filter .15s,box-shadow .15s}.bt{box-shadow:inset 0 -3px 0 #0005}.bt:hover,nav button:hover{filter:brightness(1.18)}.bt:active,nav button:active{transform:translateY(2px);box-shadow:none}
nav button:not(.on):hover{border-color:var(--g)}
.rec{transition:transform .15s,border-color .15s,box-shadow .15s}.rec:hover{transform:translateY(-2px);border-color:var(--g);box-shadow:0 4px 0 #0007}
tr.p1 td{background-image:linear-gradient(115deg,transparent 40%,#c88cff30 46%,#ffffff2a 50%,#c88cff30 54%,transparent 60%);background-size:400% 100%;animation:fxglint 4.5s linear infinite}@keyframes fxglint{from{background-position:100% 0}to{background-position:0 0}}
.match.vivo{animation:fxlive 1.6s ease-in-out infinite}@keyframes fxlive{50%{box-shadow:0 0 0 1px #d33 inset,0 0 18px #d3363a}}
.fx-in{animation:fxin .45s cubic-bezier(.2,.8,.3,1.1) both}@keyframes fxin{from{opacity:0;transform:translateY(14px) scale(.98)}}
.fx-shake{animation:fxsh .3s}@keyframes fxsh{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
.fx-cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.fx-dmg{position:fixed;inset:0;pointer-events:none;z-index:58;background:radial-gradient(transparent 45%,#c00b);opacity:0}.fx-dmg.on{animation:fxdmg .55s}@keyframes fxdmg{15%{opacity:1}}
.fx-title{position:fixed;left:0;right:0;top:28%;text-align:center;pointer-events:none;z-index:60;opacity:0;transition:opacity .35s;font-family:'Pixelify Sans',monospace;background:radial-gradient(ellipse 50% 50% at center,#000c,transparent 75%);padding:40px 16px}.fx-title.on{opacity:1}
.fx-title b{display:block;color:var(--g2);font-size:clamp(30px,8vw,64px);font-weight:700;line-height:1.1;text-shadow:4px 4px 0 #3a2c00;transform:scale(1.2);transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}.fx-title.on b{transform:none}
.fx-title span{display:block;margin-top:14px;color:#fff;font-size:clamp(16px,3vw,22px);line-height:1.4;text-shadow:2px 2px 0 #000}
.fx-ab{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 16px/1.4 'Pixelify Sans',monospace;color:#fff;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}.fx-ab.on{opacity:1}
.fx-xp{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(364px,62vw);height:8px;background:#000b;outline:1px solid #000;z-index:55;pointer-events:none}
.fx-xp i{display:block;height:100%;width:0;background:linear-gradient(#c6ff7a,#6fd12a 55%,#3d8a12);transition:width .15s}
.fx-xp::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/18 - 1px),#000a 0 calc(100%/18))}
.fx-xp b{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font:700 17px 'Pixelify Sans',monospace;color:#80ff20;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;pointer-events:auto;cursor:pointer;padding:4px 8px}.fx-xp b.pop{animation:fxpop .5s}@keyframes fxpop{40%{transform:translateX(-50%) scale(1.9)}}
.fx-mute{position:fixed;right:10px;bottom:6px;z-index:56;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:6px;width:34px;height:30px;cursor:pointer;font-size:15px;padding:0}
.fx-toast{position:fixed;top:12px;right:12px;z-index:70;display:flex;gap:10px;align-items:center;min-width:250px;max-width:calc(100vw - 24px);padding:10px 14px;background:#212121;border:2px solid #555;outline:2px solid #000;border-radius:4px;box-shadow:0 6px 18px #000a;transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}.fx-toast.on{transform:none}
.fx-toast i{font-style:normal;font-size:24px;width:40px;height:40px;flex:none;display:grid;place-items:center;background:#3a3a3a;border:2px solid #000;border-radius:3px}
.fx-toast small{display:block;font:700 13px/1.3 'Pixelify Sans',monospace;color:#ffff55;margin-bottom:6px}.fx-toast b{font:500 16px/1.3 'Pixelify Sans',monospace;color:#fff}
.fx-toast.ch{border-color:#a0a}.fx-toast.ch small{color:#ff55ff}
.fx-advs{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;background:#1b1b1b;border:2px solid #555;outline:2px solid #000;border-radius:4px;padding:12px;z-index:66;box-shadow:0 10px 30px #000c}.fx-advs[hidden]{display:none}
.fx-advs h3{margin:0 0 10px;font:700 17px/1.4 'Pixelify Sans',monospace;color:var(--g2)}.fx-adv{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #333}.fx-adv i{font-style:normal;font-size:20px;width:34px;height:34px;flex:none;display:grid;place-items:center;background:#3a3a3a;border:2px solid #000;border-radius:3px}.fx-adv.no{opacity:.4}.fx-adv.no i{filter:grayscale(1)}.fx-adv small{display:block;color:var(--mu)}
.fx-totem{position:fixed;left:50%;top:50%;width:170px;z-index:65;pointer-events:none;animation:fxtot 1.7s ease-out forwards}
@keyframes fxtot{0%{transform:translate(-50%,-50%) scale(.2) rotateY(0);opacity:0}25%{transform:translate(-50%,-50%) scale(1.4) rotateY(360deg);opacity:1}70%{opacity:1;transform:translate(-50%,-60%) scale(1.2) rotateY(720deg)}100%{opacity:0;transform:translate(-50%,-95%) scale(.6) rotateY(1080deg)}}

function pickImg(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const S=128,c=document.createElement('canvas');c.width=c.height=S;const k=Math.min(S/im.width,S/im.height),w=im.width*k,h=im.height*k;c.getContext('2d').drawImage(im,(S-w)/2,(S-h)/2,w,h);cb(c.toDataURL('image/webp',.85))};im.onerror=()=>alert('No se pudo leer esa imagen');im.src=r.result};r.readAsDataURL(f)};i.click()}

/* ===== COPIAS DE SEGURIDAD AUTOMÁTICAS (cada 1 minuto) ===== */
const BK={ms:60000,max:120,db:null,last:'',on:true,list:[],msg:''};
BK.open=()=>new Promise((ok,ko)=>{if(BK.db)return ok(BK.db);const r=indexedDB.open('golden-backups',1);r.onupgradeneeded=()=>r.result.createObjectStore('b',{keyPath:'t'});r.onsuccess=()=>{BK.db=r.result;ok(BK.db)};r.onerror=()=>ko(r.error)});
BK.tx=async(m,f)=>{const db=await BK.open();return new Promise((ok,ko)=>{const t=db.transaction('b',m),s=t.objectStore('b'),q=f(s);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})};
BK.all=async()=>(await BK.tx('readonly',s=>s.getAll())||[]).sort((a,b)=>b.t-a.t);
BK.run=async(force)=>{
 if(!BK.on&&!force)return;
 try{
  let o=null;
  try{const r=await fetch('/api/data',{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&d.partidas)o=d}}catch(e){}
  if(!o&&typeof D!=='undefined'&&D&&D.partidas&&!D.demo)o=payload();
  if(!o)return;
  const j=JSON.stringify(o);
  if(j===BK.last&&!force)return;
  BK.last=j;
  await BK.tx('readwrite',s=>s.put({t:Date.now(),n:o.partidas.length,j:o.jugadores.length,json:j}));
  const l=await BK.all();
  if(l.length>BK.max)await BK.tx('readwrite',s=>{l.slice(BK.max).forEach(x=>s.delete(x.t))});
  BK.msg='✅ Última copia: '+new Date().toLocaleTimeString();
 }catch(e){BK.msg='❌ No se pudo crear la copia'}
 BK.paint();
};
BK.fmt=t=>new Date(t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
BK.paint=async()=>{const el=document.getElementById('bkbox');if(!el)return;
 BK.list=await BK.all().catch(()=>[]);
 el.innerHTML=`<h2>🛟 Copias de seguridad automáticas</h2><div class=row><label><input type=checkbox ${BK.on?'checked':''} onchange="BK.on=this.checked;BK.paint()"> Copia automática cada minuto (si hay cambios)</label><button class=bt onclick="BK.run(true)">Copia ahora</button><button class=bt onclick="BK.dlAll()">Descargar todas</button><button class="bt r" onclick="BK.clear()">Vaciar copias</button></div><p style="color:var(--mu);margin:4px 0">${BK.msg} · Se guardan las últimas ${BK.max} en este navegador. Funciona mientras la pestaña esté abierta con la sesión de Admin iniciada.</p><div class=w style="max-height:260px;overflow:auto"><table><tr><th class=l>Fecha</th><th>Partidas</th><th>Borrushers</th><th>Tamaño</th><th></th></tr>${BK.list.slice(0,40).map(x=>`<tr><td class=l>${BK.fmt(x.t)}</td><td>${x.n}</td><td>${x.j}</td><td>${(x.json.length/1024).toFixed(0)} KB</td><td><button class=bt onclick="BK.dl(${x.t})">Descargar</button> <button class="bt r" onclick="BK.restore(${x.t})">Restaurar</button></td></tr>`).join('')||'<tr><td colspan=5>Aún no hay copias</td></tr>'}</table></div>`};
BK.dl=t=>{const x=BK.list.find(b=>b.t==t);if(!x)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x.json],{type:'application/json'}));a.download='backup-'+new Date(t).toISOString().replace(/[:.]/g,'-')+'.json';a.click()};
BK.dlAll=()=>{if(!BK.list.length)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(BK.list.map(x=>({fecha:new Date(x.t).toISOString(),datos:JSON.parse(x.json)})))],{type:'application/json'}));a.download='backups-golden-league.json';a.click()};
BK.clear=async()=>{if(confirm('¿Borrar todas las copias guardadas en este navegador?')){await BK.tx('readwrite',s=>s.clear());BK.last='';BK.msg='Copias vaciadas';BK.paint()}};
BK.restore=t=>{const x=BK.list.find(b=>b.t==t);if(!x||!confirm('¿Restaurar la copia del '+BK.fmt(t)+'? Se sustituirán los datos actuales (antes se hace una copia del estado actual).'))return;
 BK.run(true).then(()=>{D=JSON.parse(x.json);save('Copia del '+BK.fmt(t)+' restaurada')})};
(()=>{const v=view6;view6=function(a){v(a);if(adm){const d=document.createElement('div');d.className='card';d.id='bkbox';a.appendChild(d);BK.paint()}}})();
setInterval(()=>{if(typeof adm!=='undefined'&&adm)BK.run()},BK.ms);

 const bar=t=>{ab.textContent=t;flash(ab,1700)};
 const dmg=()=>flash(dm,600);
 const shake=()=>{if(rm)return;const a=$('#app');a.classList.remove('fx-shake');void a.offsetWidth;a.classList.add('fx-shake')};
 /* --- barra de XP (progreso de scroll) y nivel = logros conseguidos --- */
 const xp=mk('div','fx-xp','<i></i><b title="Ver logros"></b>'),xf=xp.firstChild,xl=xp.lastChild;let bottom=false;
 const scr=()=>{const m=document.documentElement.scrollHeight-innerHeight,k=m>40?Math.min(1,scrollY/m):1;xf.style.width=k*100+'%';if(m>40&&k>.98&&!bottom){bottom=true;S.orb()}else if(k<.9)bottom=false};addEventListener('scroll',scr,{passive:true});
 /* --- logros (advancements) --- */
 const ADV={welcome:['🏠','Bienvenido a la liga','Entra por primera vez en la Golden League'],t0:['🏆','¿Quién va primero?','Consulta la clasificación'],t5:['🥇','Cazarrécords','Mira los récords de la liga'],t6:['🏛️','Historia viva','Consulta el palmarés'],t7:['🌟','Todo lo que brilla','Visita los Golden Awards'],t9:['📈','Mente analítica','Entra en Análisis'],t10:['📅','Planificador','Revisa el calendario'],
  scout:['👤','Ojeador','Abre la ficha de un Borrusher'],squad:['🛡️','Espíritu de equipo','Abre la ficha de una Borrusquad'],search:['🔍','Detective','Usa el buscador'],live:['🔴','En directo','Mira una partida en vivo'],op:['⚙️','Operador','Entra como administrador'],
  explore:['🗺️','Aventurero de la liga','Visita todas las secciones',1],secret:['🗿','¡Borrush!','Encuentra el secreto escondido',1]};
 let got=ls.get('gl-adv',{}),vis=ls.get('gl-vis',[]),tq=[],busy=false;
 const lvl=()=>{xl.textContent=Object.keys(got).filter(k=>ADV[k]).length};
 function adv(id){if(got[id]||!ADV[id])return;got[id]=Date.now();ls.set('gl-adv',got);tq.push(id);if(!busy)toast()}
 function toast(){const id=tq.shift();if(!id){busy=false;return}busy=true;const[ic,n,d,ch]=ADV[id],t=mk('div','fx-toast'+(ch?' ch':''),`<i>${ic}</i><div><small>${ch?'¡Desafío completado!':'¡Logro conseguido!'}</small><b>${n}</b></div>`);t.title=d;
  ch?S.totem():S.adv();xl.classList.remove('pop');void xl.offsetWidth;xl.classList.add('pop');lvl();requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('on')));
  setTimeout(()=>{const r=t.getBoundingClientRect();burst(r.left+30,r.top+r.height/2,{n:12,c:ch?['#ff55ff','#ffd966']:['#ffff55','#80ff20'],sp:3,up:1})},250);
  setTimeout(()=>{t.classList.remove('on');setTimeout(()=>{t.remove();toast()},420)},3800)}
 const pn=mk('div','fx-advs');pn.hidden=true;
 const paint=()=>{const ks=Object.keys(ADV),n=ks.filter(k=>got[k]).length;pn.innerHTML=`<h3>Logros · ${n}/${ks.length}</h3>`+ks.map(k=>{const[ic,nm,d,ch]=ADV[k],h=!got[k]&&ch&&k=='secret';return`<div class="fx-adv${got[k]?'':' no'}"><i>${h?'❓':ic}</i><div><b>${h?'???':nm}</b><small>${h?'Algunos secretos se escriben con el teclado…':d}</small></div></div>`}).join('')};
 xl.addEventListener('click',e=>{e.stopPropagation();paint();pn.hidden=!pn.hidden;S.click()});
 document.addEventListener('click',e=>{if(!pn.hidden&&!e.target.closest('.fx-advs'))pn.hidden=true});
 const mu=mk('button','fx-mute');const mut=()=>{mu.textContent=snd?'🔊':'🔇';mu.title=snd?'Silenciar efectos':'Activar sonidos'};mut();
 mu.addEventListener('click',()=>{snd=!snd;ls.set('gl-snd',snd);mut();S.click()});
 /* --- tótem: secreto al escribir «borrush» o pulsar 7 veces el logo --- */
 function totem(){const lg=document.querySelector('.logo');if(lg){const t=document.createElement('img');t.src=lg.src;t.className='fx-totem';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}S.totem();
  for(let i=0;i<4;i++)setTimeout(()=>burst(innerWidth/2,innerHeight/2,{n:30,c:['#55ff55','#ffff55','#b6ff6a'],sp:6,g:.08,L:70,up:2}),i*180);adv('secret')}
 let typed='',lc=0,lt=0;
 document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.key.length!=1)return;typed=(typed+e.key.toLowerCase()).slice(-7);if(typed=='borrush'){typed='';totem()}});
 const lg=document.querySelector('.logo');if(lg)lg.addEventListener('click',e=>{const now=Date.now();lc=now-lt<700?lc+1:0;lt=now;S.pling([0,4,7,12,16,19,24][lc%7]);burst(e.clientX,e.clientY,{n:8,c:['#ffd966','#fff'],sp:2.5});if(lc==6){lc=0;totem()}});
 /* --- estímulos generales: clic en botones, enlaces y tarjetas --- */
 document.addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY},true);
 document.addEventListener('click',e=>{const b=e.target.closest('button,.bt,a,summary,.rec[onclick],.sri');if(!b||b.closest('.fx-mute,.fx-xp'))return;S.click();if(e.detail)burst(e.clientX,e.clientY,{n:6,sp:2,L:24,s:3})});
 /* --- al cambiar de sección: actionbar, entrada de tarjetas y contadores --- */
 let fresh=0,first=true,lk=null;
 const countUp=b=>{const t=b.textContent.trim();if(!/^\d+(\.\d+)?$/.test(t)||+t<=0)return;const v=+t,dc=(t.split('.')[1]||'').length,t0=performance.now();const st=n=>{const k=Math.min(1,(n-t0)/700);b.textContent=k<1?(v*(1-Math.pow(1-k,3))).toFixed(dc):t;if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)};
 function enter(){if(rm)return;[...document.querySelectorAll('#app .card,#app .match')].slice(0,14).forEach((c,i)=>{c.style.animationDelay=i*45+'ms';c.classList.add('fx-in')});document.querySelectorAll('#app .rec b').forEach(countUp)}
 function liveCheck(){const ev=(D&&D.enVivo)||[],k=ev.reduce((c,v)=>c+(v.jugadores||[]).reduce((s,j)=>s+(+j.kills||0),0),0);
  if(ev.length&&tab==8)adv('live');
  if(lk!=null&&k>lk&&(tab==8||tab==10||tab==HOME)){S.hit();shake();bar('⚔ ¡Nueva kill en vivo!');const m=document.querySelector('#app .match.vivo');if(m){const r=m.getBoundingClientRect();burst(r.left+r.width/2,r.top+40,{n:18,c:['#ff5555','#ffaaaa','#fff'],sp:4})}}lk=k}
 new MutationObserver(()=>{if(Date.now()-fresh<700)enter();liveCheck();scr()}).observe($('#app'),{childList:true});
 function onTab(i,p){if(!first&&i!==p)bar(`${ICONS[i]||''} ${TABS[i]||''}`.trim());first=false;adv('t'+i);
  if(i!==11&&!vis.includes(i)){vis.push(i);ls.set('gl-vis',vis);if(ORDER.filter(x=>x!==11).every(x=>vis.includes(x)))adv('explore')}}
 /* --- enganches a las funciones de la liga --- */
 const _go=go;go=function(i,keep){const p=tab;fresh=Date.now();_go(i,keep);onTab(i,p)};
 const _pl=pl;pl=function(n){_pl(n);adv('scout')};
 const _tm=tm;tm=function(n){_tm(n);adv('squad')};
 const _sg=srchGo;srchGo=function(el){_sg(el);adv('search')};
 const _lg=login;login=async function(){await _lg();if(adm){S.levelup();title('⚙ Modo operador','Ya puedes editar la liga',2000);adv('op')}else{S.hurt();dmg()}};
 const _vK=vK;vK=function(i,j,k,d){_vK(i,j,k,d);if(d>0&&k=='kills'){S.hit();shake();burst(mx,my,{n:14,c:['#ff5555','#ffd966','#fff'],sp:4})}else if(d>0){S.hurt();dmg()}};
 const _sv=save;save=async function(t){await _sv(t);if(!String(msg).startsWith('✅')){S.hurt();dmg();return}
  if(/campeón/.test(t)){const m=/campeón ([^·]+)/.exec(t);title('🏆 ¡CAMPEÓN!',esc(m?m[1].trim():''),4200);S.levelup();for(let i=0;i<6;i++)setTimeout(()=>firework(innerWidth*(.2+Math.random()*.6),innerHeight*(.2+Math.random()*.35)),300+i*420)}
  else if(/^Partida \S+ guardada/.test(t)){title('¡PARTIDA GUARDADA!',esc(t),2400);S.levelup();burst(innerWidth/2,innerHeight*.35,{n:40,c:['#80ff20','#c6ff7a','#ffd966'],sp:6,L:55})}
  else{S.orb();bar('✔ '+t)}};
 lvl();scr();setTimeout(()=>adv('welcome'),1200);
 return{S,burst,firework,title,bar,adv,totem}})();
</script></body></html>
