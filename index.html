<style>
:root{--bg:#121212;--card:#1d1d1d;--line:#333;--tx:#eee;--mu:#999;--g:#e0a912;--g2:#ffd966}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
header{padding:22px 16px 10px;text-align:center;background:linear-gradient(#2a2208,var(--bg))}
h1{margin:0;color:var(--g2);letter-spacing:2px;font-size:clamp(22px,5vw,38px)}header p{margin:4px;color:var(--mu)}.logo{display:block;margin:0 auto 6px;height:clamp(70px,16vw,110px);width:auto}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button,select{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--g);color:#000;border-color:var(--g);font-weight:700}
main{max-width:1100px;margin:auto;padding:12px}.demo{background:#5a1d1d;text-align:center;padding:6px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
h2{color:var(--g);margin:0 0 10px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.rec small{color:var(--mu)}.rec b{display:block;font-size:22px;color:var(--g2)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--g);cursor:pointer;position:sticky;top:0;background:var(--card)}td.l,th.l{text-align:left}
tr.p1 td{background:#3d3208}tr.p2 td{background:#2b2b2b}tr.p3 td{background:#3a2412}a{color:var(--g2);cursor:pointer;text-decoration:underline dotted}
.crest{width:2em;height:2em;margin-right:6px;vertical-align:-.6em;object-fit:contain}.crestbig{width:64px;height:64px;object-fit:contain;vertical-align:middle;margin-right:8px}.ic{width:1.3em;height:1.3em;object-fit:contain;vertical-align:-.25em;border-radius:4px}.bar{fill:var(--g)}svg text{fill:var(--mu);font-size:9px}.lg span{margin-right:12px;font-size:12px}details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer}
input{background:#111;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit}.k{width:72px;text-align:center}.bt{background:var(--g);color:#000;border:0;padding:8px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.bt.r{background:#a33;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.ok{background:#1d3d1d;text-align:center;padding:8px;border-radius:8px;margin:8px 0}
.match{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.match.vivo{border-color:#d33;box-shadow:0 0 0 1px #d33 inset}.mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-bottom:8px}.mb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.pt{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}.pt.r{flex-direction:row-reverse;text-align:right}.sc{font-size:clamp(24px,6vw,38px);font-weight:800;color:var(--g2);white-space:nowrap}.mn{text-align:center;color:var(--mu);font-size:13px;margin-top:6px}.st{font-weight:700;font-size:11px;padding:2px 8px;border-radius:99px;background:#333;color:#ccc}.st.vivo{background:#d33;color:#fff}.st.final{background:#1d3d1d;color:#9f9}.st.cancelada{background:#4a1d1d;color:#f99}.st.retrasada{background:#4a3a10;color:#fc6}.st.pendiente{background:#333;color:#ccc}.cx{opacity:.55}.cx td{text-decoration:line-through}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:5px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}.mw{color:var(--g2)}

.shell{display:flex;align-items:flex-start;max-width:1380px;margin:auto}.content{flex:1;min-width:0}
#side{width:220px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 8px;border-right:1px solid var(--line)}
#side nav{display:flex;flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;position:static;padding:0;gap:4px}
#side nav button{text-align:left;width:100%}
#menub{display:none}
#sbox{position:relative;max-width:520px;margin:10px auto 0;padding:0 12px;z-index:6}#sq{width:100%;padding:10px 12px;border-radius:8px}#sres{position:absolute;left:12px;right:12px;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow-y:auto;box-shadow:0 8px 24px #000a}#sres[hidden]{display:none}.sri{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.sri:hover{background:#2b2b2b}.sri small{color:var(--g);margin-right:6px}
@media(max-width:800px){.shell{display:block}#menub{display:block;position:sticky;top:0;z-index:7;width:100%;border-radius:0;padding:10px}
#side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:9;background:var(--bg);transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}}

/* ===== FX estilo Minecraft: partículas, títulos, actionbar, logros, barra de XP ===== */
body{padding-bottom:56px}
.logo{cursor:pointer;animation:fxbob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 10px #e0a91255)}@keyframes fxbob{50%{transform:translateY(-6px) rotate(-2deg)}}
.bt:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}.bt:disabled:hover{filter:grayscale(.6)}.bt:disabled:active{transform:none}
.bt,nav button{transition:transform .08s,filter .15s,box-shadow .15s}.bt{box-shadow:inset 0 -3px 0 #0005}.bt:hover,nav button:hover{filter:brightness(1.18)}.bt:active,nav button:active{transform:translateY(2px);box-shadow:none}
nav button:not(.on):hover{border-color:var(--g)}
.rec{transition:transform .15s,border-color .15s,box-shadow .15s}.rec:hover{transform:translateY(-2px);border-color:var(--g);box-shadow:0 4px 0 #0007}
tr.p1 td{background-image:linear-gradient(115deg,transparent 40%,#c88cff30 46%,#ffffff2a 50%,#c88cff30 54%,transparent 60%);background-size:400% 100%;animation:fxglint 4.5s linear infinite}@keyframes fxglint{from{background-position:100% 0}to{background-position:0 0}}
.match.vivo{animation:fxlive 1.6s ease-in-out infinite}@keyframes fxlive{50%{box-shadow:0 0 0 1px #d33 inset,0 0 18px #d3363a}}
.fx-in{animation:fxin .45s cubic-bezier(.2,.8,.3,1.1) both}@keyframes fxin{from{opacity:0;transform:translateY(14px) scale(.98)}}
.fx-shake{animation:fxsh .3s}@keyframes fxsh{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
.fx-cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.fx-dmg{position:fixed;inset:0;pointer-events:none;z-index:58;background:radial-gradient(transparent 45%,#c00b);opacity:0}.fx-dmg.on{animation:fxdmg .55s}@keyframes fxdmg{15%{opacity:1}}
.fx-title{position:fixed;left:0;right:0;top:28%;text-align:center;pointer-events:none;z-index:60;opacity:0;transition:opacity .35s;font-family:'Pixelify Sans',monospace;background:radial-gradient(ellipse 50% 50% at center,#000c,transparent 75%);padding:40px 16px}.fx-title.on{opacity:1}
.fx-title b{display:block;color:var(--g2);font-size:clamp(30px,8vw,64px);font-weight:700;line-height:1.1;text-shadow:4px 4px 0 #3a2c00;transform:scale(1.2);transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}.fx-title.on b{transform:none}
.fx-title span{display:block;margin-top:14px;color:#fff;font-size:clamp(16px,3vw,22px);line-height:1.4;text-shadow:2px 2px 0 #000}
.fx-ab{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 16px/1.4 'Pixelify Sans',monospace;color:#fff;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}.fx-ab.on{opacity:1}
.fx-xp{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(364px,62vw);height:8px;background:#000b;outline:1px solid #000;z-index:55;pointer-events:none}
.fx-xp i{display:block;height:100%;width:0;background:linear-gradient(#c6ff7a,#6fd12a 55%,#3d8a12);transition:width .15s}
.fx-xp::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/18 - 1px),#000a 0 calc(100%/18))}
.fx-xp b{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font:700 17px 'Pixelify Sans',monospace;color:#80ff20;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;pointer-events:auto;cursor:pointer;padding:4px 8px}.fx-xp b.pop{animation:fxpop .5s}@keyframes fxpop{40%{transform:translateX(-50%) scale(1.9)}}
.fx-mute{position:fixed;right:10px;bottom:6px;z-index:56;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:6px;width:34px;height:30px;cursor:pointer;font-size:15px;padding:0}
.fx-toast{position:fixed;top:12px;right:12px;z-index:70;display:flex;gap:10px;align-items:center;min-width:250px;max-width:calc(100vw - 24px);padding:10px 14px;background:#212121;border:2px solid #555;outline:2px solid #000;border-radius:4px;box-shadow:0 6px 18px #000a;transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}.fx-toast.on{transform:none}
.fx-toast i{font-style:normal;font-size:24px;width:40px;height:40px;flex:none;display:grid;place-items:center;background:#3a3a3a;border:2px solid #000;border-radius:3px}
.fx-toast small{display:block;font:700 13px/1.3 'Pixelify Sans',monospace;color:#ffff55;margin-bottom:6px}.fx-toast b{font:500 16px/1.3 'Pixelify Sans',monospace;color:#fff}
.fx-toast.ch{border-color:#a0a}.fx-toast.ch small{color:#ff55ff}
.fx-advs{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;background:#1b1b1b;border:2px solid #555;outline:2px solid #000;border-radius:4px;padding:12px;z-index:66;box-shadow:0 10px 30px #000c}.fx-advs[hidden]{display:none}
.fx-advs h3{margin:0 0 10px;font:700 17px/1.4 'Pixelify Sans',monospace;color:var(--g2)}.fx-adv{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #333}.fx-adv i{font-style:normal;font-size:20px;width:34px;height:34px;flex:none;display:grid;place-items:center;background:#3a3a3a;border:2px solid #000;border-radius:3px}.fx-adv.no{opacity:.4}.fx-adv.no i{filter:grayscale(1)}.fx-adv small{display:block;color:var(--mu)}
.fx-totem{position:fixed;left:50%;top:50%;width:170px;z-index:65;pointer-events:none;animation:fxtot 1.7s ease-out forwards}
@keyframes fxtot{0%{transform:translate(-50%,-50%) scale(.2) rotateY(0);opacity:0}25%{transform:translate(-50%,-50%) scale(1.4) rotateY(360deg);opacity:1}70%{opacity:1;transform:translate(-50%,-60%) scale(1.2) rotateY(720deg)}100%{opacity:0;transform:translate(-50%,-95%) scale(.6) rotateY(1080deg)}}
@media(prefers-reduced-motion:reduce){.logo,tr.p1 td,.match.vivo,.fx-in,.fx-shake{animation:none!important}}

.cp-in{animation:cpin .35s cubic-bezier(.2,.8,.3,1) both;transform-origin:top}@keyframes cpin{from{opacity:0;transform:translateY(-8px) scaleY(.96)}}
.pbar{transform-origin:left;animation:pbar .8s cubic-bezier(.2,.8,.3,1) both}@keyframes pbar{from{transform:scaleX(0)}}
tr.hl td{animation:hlrow 2.6s ease-out}@keyframes hlrow{0%,35%{background:#e0a91266}100%{background:transparent}}
.qtab tr{animation:fxin .4s both}.qtab tr:nth-child(2){animation-delay:0.05s}.qtab tr:nth-child(3){animation-delay:0.10s}.qtab tr:nth-child(4){animation-delay:0.15s}.qtab tr:nth-child(5){animation-delay:0.20s}.qtab tr:nth-child(6){animation-delay:0.25s}.qtab tr:nth-child(7){animation-delay:0.30s}.qtab tr:nth-child(8){animation-delay:0.35s}.qtab tr:nth-child(9){animation-delay:0.40s}.qtab tr:nth-child(10){animation-delay:0.45s}.qtab tr:nth-child(11){animation-delay:0.50s}.qtab tr:nth-child(12){animation-delay:0.55s}
.nx-btn{animation:nxglow 1.8s ease-in-out infinite}@keyframes nxglow{50%{box-shadow:0 0 0 3px #e0a91233,0 0 16px #e0a91288}}

gDel(${i})">Borrar</button>`:`<button class=bt onclick="cgPeso(${i})">${ex?'✅ Volver a sobres':'🚫 Sacar de sobres'}</button><button class="bt r" onclick="cgQuit(${i})">${c.del?'↩ Devolver':'🗑 Quitar'}</button><button class=bt onclick=\"cgEditG(${i})\">✏ Editar</button>${c.edited?`<button class=\"bt r\" onclick=\"cgUnedit(${i})\">↺ Original</button>`:''}`}</div></div>`}).join('')||'<p style="color:var(--mu)">No hay cartas con esos filtros.</p>'}</div>
 ${L.length>cgN?`<div class=row><button class=bt onclick="cgN+=48;draw()">Mostrar más (${L.length-cgN} restantes)</button></div>`:''}</div>`}
function cgForm(){const e=cgE,f=(id,l,v,w)=>`<label style="font-size:12px;color:var(--mu)">${l}<br><input id="${id}" value="${esc(v??'')}" style="width:${w||150}px"></label>`;
 return`<div class=hol-ed id=cgform><b>✏ Editando carta del juego · ${sNomT(e.T)} · ${esc(e.base)}</b><div class=row>${f('ge_n','Nombre',e.i.name,160)}${f('ge_r','Valoración (1-99)',e.i.r,90)}<label style="font-size:12px;color:var(--mu)">Rareza<br><select id=ge_t><option value="">Automática</option>${Object.keys(TIER).map(k=>`<option value="${k}" ${e.i.tier==k?'selected':''}>${TIER[k]}</option>`).join('')}</select></label>${f('ge_l','Etiqueta (especiales)',e.i.label,150)}${f('ge_i','Icono',e.i.ic,70)}${f('ge_s','Subtítulo',e.i.sub,160)}${f('ge_m','Imagen (data:image…)',e.i.img,170)}${f('ge_v','Valor en 🪙 (venta = 50%)',e.i.val,110)}</div><div class=row><button class=bt onclick="cgSaveG()">💾 Guardar</button><button class=bt onclick="cgE=null;draw()">Cancelar</button></div><small style="color:var(--mu)">Solo se guardan los campos que cambies; el resto sigue el cálculo automático del juego. Afecta a esta carta en la temporada ${e.T} para todos los usuarios.</small></div>`}
function cgEditG(i){const{c,T}=cgList[i],ex=((D.cartasCfg||{}).edit||{})[T+'|'+c.id]||{};cgE={key:T+'|'+c.id,T,base:c.head||c.name,i:{name:c.name,r:c.r,tier:ex.tier||'',label:c.label||'',ic:c.ic||'',sub:c.sub||'',img:c.img||'',val:c.val}};draw();setTimeout(()=>{const e=$('#cgform');if(e)e.scrollIntoView({behavior:'smooth'})},60)}
function cgSaveG(){const e=cgE,C=(D.cartasCfg??={}),X=(C.edit??={}),o=X[e.key]||{},g=id=>($('#'+id).value||'').trim(),v={name:g('ge_n'),r:g('ge_r'),tier:g('ge_t'),label:g('ge_l'),ic:g('ge_i'),sub:g('ge_s'),img:g('ge_m'),val:g('ge_v')};
 if(v.r!==''&&!(+v.r>=1&&+v.r<=99))return alert('La valoración tiene que estar entre 1 y 99');if(v.val!==''&&!(+v.val>=0))return alert('El valor en monedas debe ser un número ≥ 0');if(v.img&&!isImg(v.img))return alert('La imagen debe ser data:image/… (o déjalo vacío)');
 Object.keys(v).forEach(k=>{if(String(v[k])!==String(e.i[k]??''))o[k]=(k=='r'||k=='val')&&v[k]!==''?+v[k]:v[k]});
 Object.keys(o).forEach(k=>{if(o[k]===''||o[k]==null)delete o[k]});if(Object.keys(o).length)X[e.key]=o;else delete X[e.key];cgE=null;save('Carta editada: '+(v.name||e.base)+' T'+e.T)}
function cgUnedit(i){const{c,T}=cgList[i];if(!confirm('¿Volver al cálculo original de esta carta?'))return;delete ((D.cartasCfg||{}).edit||{})[T+'|'+c.id];save('Carta restaurada: '+c.name)}
function cgQuit(i){const{c,T}=cgList[i],C=(D.cartasCfg??={}),X=(C.del??={}),k=T+'|'+c.id;
 if(X[k]){delete X[k];return save('Carta devuelta: '+c.name+' T'+T)}
 const nk=prompt('Quitar «'+c.name+(c.ver>1?' V'+c.ver:'')+'» (T'+T+', valoración '+c.r+').\nSe borra de las colecciones y deja de salir en sobres.\n¿A quién se la quitas? Escribe el nombre del usuario, o * para todos:','*');if(nk===null)return;const nick=nk.trim()||'*';
 if(nick=='*')X[k]=1;
 (D.cartasAdmin??=[]).push({id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),tipo:'quitar',nick,card:c.id,temp:T,cardName:c.name+(c.ver>1?' V'+c.ver:''),t:Date.now()});
 save('Carta quitada: '+c.name+' T'+T+(nick=='*'?' (a todos)':' a '+nick))}
function cgEdit(i){const c=cgList[i].c;ccEdit=String(c.id).slice(2);ccPre=null;draw();setTimeout(()=>{const e=$('#ccform');if(e)e.scrollIntoView({behavior:'smooth'})},60)}
function cgDel(i){ccDel(String(cgList[i].c.id).slice(2))}
function cgPeso(i){const c=cgList[i].c,P=((D.cartasCfg??={}).peso??={});if(P[c.id]===0||P[c.id]==='0')delete P[c.id];else P[c.id]=0;save((P[c.id]===0?'Sacada de los sobres: ':'Vuelve a los sobres: ')+c.name)}

const RGDESC={gb:'El nº 1 en puntos de la temporada.',gw:'Quien más victorias lleva en la temporada.',gk:'Quien más kills lleva en la temporada.',rv:'La mejor racha de victorias seguidas, a partir de la racha mínima.',rk:'La partida con más kills de la temporada. Su valoración sale de lo bien que jugó esa partida (puesto + kills) mezclada con su valoración de entonces.',rev:'Quien más ha subido de valoración respecto a la temporada anterior (mínimo 3 partidas).',hj:'El mejor de cada jornada. Valoración fija: «peso de la partida» es cuánto cuenta lo bien que jugó esa partida frente a su valoración del momento; el resultado queda entre el mínimo y el máximo.',tgb:'La borrusquad con más puntos de la temporada.',camp:'El campeón de cada competición cerrada.',eqc:'La borrusquad campeona de cada competición.',aw:'Los ganadores de cada Golden Award (jugadores y borrusquads): su carta sale en la temporada siguiente a la del premio.'};
/* ===== Admin: qué cartas especiales se crean solas ===== */
function setAwCarta(i,v){const p=D.premios[i];if(!p)return;if(v)delete p.carta;else p.carta=false;save((v?'Carta automática activada: ':'Carta automática desactivada: ')+p.nombre)}
function setRuleOn(k,v){const R=((D.cartasCfg??={}).reglas??={});(R[k]??={}).on=!!v;save((v?'Se crean solas las cartas «':'Ya no se crean solas las cartas «')+GRD[k].t+'»')}
function spSave(){const v=Math.round(+$('#sp_min').value);if(!(v>=1&&v<=99))return alert('La media mínima tiene que estar entre 1 y 99');(D.cartasCfg??={}).spMin=v;save('Media mínima de las cartas especiales: '+v)}
function adminAuto(){const P=D.premios||[],chk=(on,lbl,fn)=>`<label style="display:inline-flex;gap:6px;align-items:center;min-width:250px;margin:3px 12px 3px 0"><input type=checkbox ${on?'checked':''} onchange="${fn}"> ${lbl}</label>`,
 spm=+(D.cartasCfg||{}).spMin,mn=spm>=1&&spm<=99?Math.round(spm):85;
 return`<div class=card><h2>⚙ Cartas automáticas: ¿cuáles se crean solas?</h2><p style="color:var(--mu);margin:0 0 8px;font-size:13px">Marca las que quieres que el juego cree solo y desmarca las que no. También puedes crear tus propios tipos de carta y elegir si se crean solos o no. Se guarda al momento. Las cartas que ya existen no se tocan (para quitarlas usa <b>🗑 Quitar</b> en el catálogo). Si borras una partida o jornada, un Golden Award o un palmarés, sus cartas se borran solas.</p>
 <h3 style="color:var(--g);margin:10px 0 6px;font-size:16px">Por tipo de carta</h3><div class=row style="flex-wrap:wrap">${grdKeys().map(k=>{const r=gcRule(k);return`<span style="display:inline-flex;align-items:center">${chk(r.on,esc(r.ic)+' '+esc(GRD[k].t),`setRuleOn('${k}',this.checked)`)}<button class="bt r" style="padding:2px 8px;margin:3px 14px 3px 0" title="Borrar este tipo de carta" onclick="rgDel('${k}')">🗑</button></span>`}).join('')}</div>${rgDeletedHtml()}${normPanel()}
 ${tiposPropiosHtml()}
 <h3 style="color:var(--g);margin:10px 0 6px;font-size:16px">Por Golden Award <small style="color:var(--mu);font-weight:400">(solo cuenta si «${esc(GRD.aw.t)}» está activo)</small></h3><div class=row style="flex-wrap:wrap">${P.map((p,i)=>chk(p.carta!==false,esc(p.icono||'🏅')+' '+esc(p.nombre),`setAwCarta(${i},this.checked)`)).join('')||'<span style="color:var(--mu)">Aún no hay Golden Awards.</span>'}</div>
 <h3 style="color:var(--g);margin:10px 0 6px;font-size:16px">Media de las cartas especiales</h3><div class=row>Media mínima <input id=sp_min class=k type=number min=1 max=99 value="${mn}"><button class=bt onclick="spSave()">💾 Guardar</button><small style="color:var(--mu)">Ninguna carta especial automática baja de esta media (excepto Héroe de la jornada y Récord, que usan su propio rango). Golden Borrusher y Golden Borrusquad además quedan siempre por encima de todas las cartas normales de su tipo.</small></div></div>`}
function spStat(){const T=curS(),by={};let tot=0;gcDeck(T).forEach(c=>{if(!c.special||c.w===0)return;const w=c.w==null?1:c.w,k=ctype(c);by[k]=(by[k]||0)+w;tot+=w});return{by,tot}}
function spPct(k){const s=spStat(),v=s.by[k]||0;return s.tot?(Math.round(v/s.tot*1000)/10)+'% de las especiales':'0%'}
function ctPct(src){const W=$('#ct_w'),P=$('#ct_p');if(!W||!P)return;const S=spStat().tot;if(src=='p'){const p=Math.max(0,Math.min(99.9,+P.value||0));W.value=S>0?Math.round(p/(100-p)*S*1000)/1000:(p>0?1:0)}else{const w=Math.max(0,+W.value||0);P.value=S>0?Math.round(w/(w+S)*1000)/10:(w>0?100:0)}const i=$('#ct_pi');if(i)i.textContent='Sobre las cartas especiales actuales de '+sNomT(curS())+' (peso total '+(Math.round(S*100)/100)+'): al crearlo, las demás se reajustan solas.'}
function adminTipos(){
 const th=gcTh(),TP=(D.cartasCfg||{}).tipos||[],T=curS(),cnt={};
 gcDeck(T).forEach(c=>{const k=ctype(c);cnt[k]=(cnt[k]||0)+1});
 const nin=(id,v,ex)=>`<input id="${id}" class=k type=number step=any value="${v}" ${ex||''}>`,
  rows=grdKeys().map(k=>{const r=gcRule(k),d=GRD[k],f=(id,l,v,ex)=>`${l} ${nin('rg_'+k+'_'+id,v,ex)}`;
   let ex='';if('b' in d)ex+=f('b','Valoración = nivel actual +',r.b);if('rm' in d)ex+=f('rm','Racha mínima',r.rm,'min=1');if('top' in d)ex+=f('top','Héroes por jornada',r.top,'min=1')+f('mk','Kills mínimas',r.mk,'min=0');if('min' in d)ex+=f('min','Valoración mín.',r.min,'min=1 max=99')+f('max','máx.',r.max,'min=1 max=99')+f('wp','Peso de la partida %',Math.round(r.wp*100),'min=0 max=100');
   return`<div class=match><div class=row><label><input type=checkbox id="rg_${k}_on" ${r.on?'checked':''}> <b>${esc(d.t)}</b></label> Icono <input id="rg_${k}_ic" class=k value="${esc(r.ic)}" maxlength=4> Etiqueta <input id="rg_${k}_n" value="${esc(r.n)}" style="width:190px"> ${f('w','Peso en sobres',r.w,'min=0')} <small style="color:var(--mu)">${cnt[k]||0} en ${sNomT(T)} · ≈ ${spPct(k)}</small><button class=bt onclick="ccFrom('rule','${k}')">➕ Crear carta</button><button class="bt r" onclick="rgDel('${k}')">🗑 Borrar tipo</button></div><div class=row><small style="color:var(--mu)">${esc(RGDESC[k]||'')}</small></div><div class=row>${ex}</div></div>`}).join('');
 return adminAuto()+`<div class=card><h2>🧩 Tipos de carta y cómo se generan</h2><p style="color:var(--mu);margin:0 0 8px;font-size:13px">Aquí están todos los tipos que existen. Cada uno tiene un botón <b>➕ Crear carta</b> que abre el formulario de cartas personalizadas con ese tipo ya rellenado.</p>
 <h3 style="color:var(--g);margin:10px 0 6px;font-size:16px">Rarezas (cartas normales)</h3>
 <div class=row>Valoración mínima de cada rareza: ${['plata','oro','rubi','diamante'].map(k=>`${TIER[k]} ${nin('th_'+k,th[k],'min=2 max=99')}`).join(' · ')} <small style="color:var(--mu)">(por debajo de plata = bronce)</small></div>
 <div class=row><button class=bt onclick="thSave()">💾 Guardar rangos</button><button class="bt r" onclick="thReset()">↺ Por defecto</button></div>
 <div class=row>${['bronce','plata','oro','rubi','diamante','especial'].map(k=>`<button class=bt onclick="ccFrom('tier','${k}')">➕ ${TIER[k]} <small>(${k=='especial'?(cnt.custom||0)+' mías':sNomT(T)+': '+gcDeck(T).filter(c=>!c.special&&c.tier==k).length})</small></button>`).join('')}</div>
 <h3 style="color:var(--g);margin:14px 0 6px;font-size:16px">Cartas especiales (se generan solas)</h3>
 <p style="color:var(--mu);margin:0 0 8px;font-size:13px">Puedes activarlas o desactivarlas, cambiar nombre e icono, su peso en los sobres (0 = no sale en sobres) y cómo se calcula su valoración. Los cambios afectan a las cartas que aún no se hayan generado: las que ya existen y la gente ya tiene conservan su valoración.</p>
 ${rows}<div class=row><button class=bt onclick="rgSave()">💾 Guardar reglas</button><button class="bt r" onclick="rgReset()">↺ Reglas por defecto</button></div>
</div>`}
function ccFrom(kind,key){const th=gcTh();let p;
 if(kind=='tier')p={tier:key,r:key=='bronce'?50:key=='especial'?92:th[key],ic:'⭐',label:'',w:1};
 else if(kind=='rule'){const r=gcRule(key);p={tier:'especial',r:90,ic:r.ic,label:r.n.replace(/\s*\{[nj]\}\s*/g,' ').trim(),w:r.w}}
 else{const t=((D.cartasCfg||{}).tipos||[]).find(x=>x.id==key);if(!t)return;p={tier:t.tier,r:t.r,ic:t.ic,label:t.nombre,w:t.w}}
 ccEdit='';ccPre=p;draw();setTimeout(()=>{const e=$('#ccform');if(e)e.scrollIntoView({behavior:'smooth'})},60)}
function thSave(){const o={};for(const k of['plata','oro','rubi','diamante'])o[k]=Math.round(+$('#th_'+k).value);if(!(o.plata>=2&&o.oro>o.plata&&o.rubi>o.oro&&o.diamante>o.rubi&&o.diamante<=99))return alert('Los mínimos tienen que ir de menor a mayor: plata < oro < rubí < diamante (entre 2 y 99)');(D.cartasCfg??={}).th=o;save('Rangos de rareza guardados')}
function thReset(){if(D.cartasCfg)delete D.cartasCfg.th;save('Rangos de rareza restaurados')}
function rgSave(){const R={};{const old=(D.cartasCfg||{}).reglas||{};Object.keys(old).forEach(k=>{if(old[k]&&old[k].del)R[k]=old[k]})}for(const k of grdKeys()){const d=GRD[k],g=f=>$('#rg_'+k+'_'+f),o={on:g('on').checked,n:(g('n').value||'').trim()||d.n,ic:(g('ic').value||'').trim()||d.ic,w:Math.max(0,+g('w').value||0)};
  for(const f of['b','rm','min','max','wp','top','mk']){if(!(f in d))continue;const e=g(f);if(!e)continue;let v=+e.value;if(e.value===''||!isFinite(v))v=d[f]*(f=='wp'?100:1);if(f=='wp')v=Math.min(100,Math.max(0,v))/100;o[f]=v}
  if(o.min!=null&&o.max!=null&&o.min>o.max)return alert('«'+d.t+'»: la valoración mínima no puede ser mayor que la máxima');
  R[k]=o}
 (D.cartasCfg??={}).reglas=R;save('Reglas de generación de cartas guardadas')}
function rgReset(){if(!confirm('¿Volver a las reglas por defecto de las cartas especiales? (También se restauran los tipos que hayas borrado)'))return;if(D.cartasCfg)delete D.cartasCfg.reglas;save('Reglas de cartas restauradas')}
function rgDel(k){const d=GRD[k];if(!d)return;if(!confirm('¿Borrar el tipo de carta «'+d.t+'»?\n\nDejará de crearse solo y se quitarán del catálogo y de las colecciones todas las cartas de este tipo que ya existan. Las cartas personalizadas no se tocan.\nPodrás restaurar el tipo después: volverá al catálogo, pero quien ya haya abierto «Juegos» tras el borrado no recupera las cartas que se le quitaron.'))return;
 try{gcRegSync()}catch(e){}
 const C=D.cartasCfg??={},X=(C.del??={}),ids=[];let n=0;
 try{allS().forEach(T=>{gcDeck(T).filter(c=>c.special&&!c.custom&&idType(c.id)==k).forEach(c=>{const kk=T+'|'+c.id;X[kk]=1;ids.push(kk);(D.cartasAdmin??=[]).push({id:cgOid(),tipo:'quitar',nick:'*',card:c.id,temp:T,cardName:c.name+' · '+(c.label||d.t),t:Date.now(),rg:k});n++})})}catch(e){console.error(e)}
 ['sreg','evreg'].forEach(f=>{const R=C[f];if(!R)return;Object.keys(R).forEach(T=>{const o=R[T];if(o&&typeof o=='object')Object.keys(o).forEach(id=>{if(idType(id)==k)delete o[id]})})});
 try{const RG=JSON.parse(localStorage.getItem('gl-reg')||'{}');Object.keys(RG).forEach(T=>Object.keys(RG[T]||{}).forEach(id=>{if(idType(id)==k)delete RG[T][id]}));localStorage.setItem('gl-reg',JSON.stringify(RG))}catch(e){}
 const r=((C.reglas??={})[k]??={});r.del=true;r.on=false;r.delIds=ids;
 save('Tipo «'+d.t+'» borrado ('+n+' carta(s) quitadas)')}
function rgRestore(k){const d=GRD[k];if(!d)return;const C=D.cartasCfg??={},r=((C.reglas??={})[k]??={});(r.delIds||[]).forEach(x=>{if(C.del)delete C.del[x]});D.cartasAdmin=(D.cartasAdmin||[]).filter(o=>!(o.tipo=='quitar'&&o.rg==k));delete r.del;delete r.delIds;r.on=true;save('Tipo «'+d.t+'» restaurado')}

const BK={ms:60000,max:120,db:null,last:'',on:true,list:[],msg:''};
BK.open=()=>new Promise((ok,ko)=>{if(BK.db)return ok(BK.db);const r=indexedDB.open('golden-backups',1);r.onupgradeneeded=()=>r.result.createObjectStore('b',{keyPath:'t'});r.onsuccess=()=>{BK.db=r.result;ok(BK.db)};r.onerror=()=>ko(r.error)});
BK.tx=async(m,f)=>{const db=await BK.open();return new Promise((ok,ko)=>{const t=db.transaction('b',m),s=t.objectStore('b'),q=f(s);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})};
BK.all=async()=>(await BK.tx('readonly',s=>s.getAll())||[]).sort((a,b)=>b.t-a.t);
BK.run=async(force)=>{
 if(!BK.on&&!force)return;
 try{
  let o=null;
  try{const r=await fetch('/api/data',{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&d.partidas)o=d}}catch(e){}
  if(!o&&typeof D!=='undefined'&&D&&D.partidas&&!D.demo)o=payload();
  if(!o)return;
  const j=JSON.stringify(o);
  if(j===BK.last&&!force)return;
  BK.last=j;
  await BK.tx('readwrite',s=>s.put({t:Date.now(),n:o.partidas.length,j:o.jugadores.length,json:j}));
  const l=await BK.all();
  if(l.length>BK.max)await BK.tx('readwrite',s=>{l.slice(BK.max).forEach(x=>s.delete(x.t))});
  BK.msg='✅ Última copia: '+new Date().toLocaleTimeString();
 }catch(e){BK.msg='❌ No se pudo crear la copia'}
 BK.paint();
};
BK.fmt=t=>new Date(t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
BK.paint=async()=>{const el=document.getElementById('bkbox');if(!el)return;
 BK.list=await BK.all().catch(()=>[]);
 el.innerHTML=`<h2>🛟 Copias de seguridad automáticas</h2><div class=row><label><input type=checkbox ${BK.on?'checked':''} onchange="BK.on=this.checked;BK.paint()"> Copia automática cada minuto (si hay cambios)</label><button class=bt onclick="BK.run(true)">Copia ahora</button><button class=bt onclick="BK.dlAll()">Descargar todas</button><button class="bt r" onclick="BK.clear()">Vaciar copias</button></div><p style="color:var(--mu);margin:4px 0">${BK.msg} · Se guardan las últimas ${BK.max} en este navegador. Funciona mientras la pestaña esté abierta con la sesión de Admin iniciada.</p><div class=w style="max-height:260px;overflow:auto"><table><tr><th class=l>Fecha</th><th>Partidas</th><th>Borrushers</th><th>Tamaño</th><th></th></tr>${BK.list.slice(0,40).map(x=>`<tr><td class=l>${BK.fmt(x.t)}</td><td>${x.n}</td><td>${x.j}</td><td>${(x.json.length/1024).toFixed(0)} KB</td><td><button class=bt onclick="BK.dl(${x.t})">Descargar</button> <button class="bt r" onclick="BK.restore(${x.t})">Restaurar</button></td></tr>`).join('')||'<tr><td colspan=5>Aún no hay copias</td></tr>'}</table></div>`};

/* ===== CUENTAS: correo + contraseña, reclamar borrushers / borrusquads, roles y avisos al admin =====

   que las colecciones de cartas (FLCARTAS, nick «_g<id>»). El id sale de la huella SHA-256 del correo.
   Las decisiones del admin (rol, borrusher y borrusquads asignados, restablecer contraseña, usuarios eliminados) se guardan en data.json:
   D.cuentas, D.reclamaciones, D.cuentasDel. */
const accLS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null};
const accMask=e=>{e=String(e||'');const i=e.indexOf('@');return i<1?'':e.slice(0,Math.min(2,i))+'***'+e.slice(i)};
const ACC_ROLES=[['usuario','Aficionado'],['moderador','Moderador'],['admin','Administrador']];

function accEnsure(){D.cuentas??=[];D.reclamaciones??=[];D.cuentasDel??=[];D.authCfg??={}}

function accRecs(){const o=((D.quiniela||{})[GCSYNC])||{},out=[];Object.keys(o).forEach(n=>{if(!/^_g\d+$/.test(n))return;const j=gcDec(o[n]);if(j&&j.v==1)out.push({...j,id:n.slice(1)})});return out}
const accRec=id=>accRecs().find(r=>r.id==id)||null;
const accCuenta=id=>(D.cuentas||[]).find(c=>c.id==id)||null;
const accRole=id=>(accCuenta(id)||{}).rol||'usuario';
const accDeleted=id=>(D.cuentasDel||[]).some(x=>x.id==id);
const accReqState=(id,r)=>{const x=(D.reclamaciones||[]).find(z=>z.acc==id&&z.rid==r.i);return x?x.estado:'pend'};
function accPending(){const out=[];accRecs().forEach(rc=>{if(accDeleted(rc.id))return;(rc.r||[]).forEach(r=>{if(accReqState(rc.id,r)=='pend')out.push({...r,acc:rc.id,nm:rc.n||rc.id,em:rc.e||''})})});return out.sort((a,b)=>a.t-b.t)}

function accMode(){const S=accSess();if(!S)return'afic';const c=accCuenta(S.id)||{},m=accLS('gl-mode')||'afic';if(m=='borr'&&c.borrusher)return'borr';if(m.startsWith('eq:')&&(c.equipos||[]).includes(m.slice(3)))return m;return'afic'}
const accModeIc=m=>m=='borr'?'🎮':m.startsWith('eq:')?'🛡️':'🙋';
function accApplyMode(){const S=accSess();if(!S)return;const c=accCuenta(S.id)||{};try{const nk=accMode()=='borr'&&c.borrusher?c.borrusher:S.name;qNick=nk;accLS('gqn',nk);const g=gcLoad();if(g.nick!=nk){g.nick=nk;gcSave(g)}}catch(e){console.error(e)}}
/* ----- contraseñas: PBKDF2-SHA256 con sal propia (no se guarda nunca la contraseña) ----- */
const accNorm=e=>String(e||'').trim().toLowerCase(),accValidMail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e),accHex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),accSalt=()=>accHex(crypto.getRandomValues(new Uint8Array(16))),accCrypto=()=>!!(window.crypto&&crypto.subtle);

 for(let k=0;k<IT;k++){const p=base.slice();for(let j=0;j<rem;j++)r.map((v,i)=>({i,s:v/T-Math.log(-Math.log(Math.random()+1e-9))})).sort((x,y)=>y.s-x.s).forEach((x,pl)=>{p[x.i]+=pa[pl]||0});

<script>/* ===== GL Juegos+ : grupos (Cartas · Diarios · Libres), 5 juegos nuevos, pestaña Fantasy y animaciones ===== */
(()=>{

 g.innerHTML=shuf([...P,...P]).map(n=>`<div class=mc data-n="${esc(n)}"><div class=mci><div class=mf>?</div><div class=mb2>${headOf(n,48)}<small>${esc(n)}</small></div></div></div>`).join('');

 const spawn=()=>{if(!alive)return;const b=document.createElement('button');b.className='rt';b.textContent='🎯';b.style.left=Math.random()*(box.clientWidth-56)+'px';b.style.top=Math.random()*(box.clientHeight-56)+'px';
  b.onpointerdown=ev=>{ev.stopPropagation();if(b.dataset.x)return;b.dataset.x=1;sc+=cb;cb=Math.min(cb+1,8);vib(12);b.className='rt pop';setTimeout(()=>b.remove(),250);U()};
  setTimeout(()=>{if(b.parentNode&&!b.dataset.x){cb=1;b.remove();U()}},1100);box.appendChild(b);setTimeout(spawn,350+Math.random()*450)};

 const iv=setInterval(()=>{t-=.1;if(!document.contains(box)){alive=false;clearInterval(iv);return}U();if(t<=0){alive=false;clearInterval(iv);const best=LS('react:best')||0;box.innerHTML=`<div style="display:grid;place-items:center;height:100%;text-align:center"><div><div style="font-size:52px;font-weight:800;color:var(--g2)">${sc}</div>${sc>best?'🏆 ¡Nuevo récord!':'Récord: '+best}</div></div>`;$('#rgo').disabled=false;if(sc>best){LS('react:best',sc);glConfetti()}}},100);spawn()};

/* ---------- ¿QUIÉN GANÓ? (libre) ---------- */
let wq=null,wqS={s:0,b:LS('who:best')||0};
const wqNew=()=>{const ids=D.ids.filter(id=>D.by[id].length>=3);if(!ids.length)return wq=null;const id=rnd(ids),g=D.by[id].slice().sort((a,b)=>a.puesto-b.puesto);wq={id,opts:shuf([g[0],...shuf(g.slice(1)).slice(0,3)]),pick:null}};

 return`<div class=card><h2>🏆 ¿Quién ganó? <small style="color:var(--mu)">🔥 Racha: ${wqS.s} · 🏅 Mejor: ${wqS.b}</small></h2><p style="margin:0 0 8px">${esc(mLbl(wq.id))} · ${esc(f.fecha||'')}${f.mapa?' · 🗺 '+esc(f.mapa):''}</p>
 ${wq.opts.map((m,i)=>{let tm='',el='';try{tm=teamOf(m.jugador,m.temporada)||''}catch(e){}try{el=eloOf('p',m.jugador)}catch(e){}const w=m.puesto==1;return`<button class="opt ${done?(w?'ok':i==wq.pick?'no':''):''}" ${done?'disabled':''} onclick="glWqPick(${i})"><span>${headOf(m.jugador,28)} <b>${esc(m.jugador)}</b> <small style="color:var(--mu)">${esc(tm)}</small></span><span>${done?`${m.puesto}º · ${m.kills}☠/${m.muertes}💀`:(el?'Elo '+el:'')}</span></button>`}).join('')}
 ${done?`<div class=ok>${wq.opts[wq.pick].puesto==1?'✅ ¡Correcto!':'❌ Fallaste'}</div><button class=bt onclick="wqNew2()">Siguiente ▶</button>`:''}</div>`}

const rkNew=()=>{const S=stats(()=>true,'all').filter(x=>x.pj>=3);if(S.length<4)return rk=null;let p;for(let i=0;i<30;i++){p=shuf(S).slice(0,4);if(new Set(p.map(x=>x.pts)).size==4)break}rk={items:shuf(p),sel:[],done:0,truth:p.slice().sort((a,b)=>b.pts-a.pts)}};

 <div class=row>${rk.done?`<button class=bt onclick="rkNew2()">Siguiente ▶</button>`:`<button class=bt onclick="glRkUndo()" ${rk.sel.length?'':'disabled'}>↩ Deshacer</button><button class=bt onclick="glRkCheck()" ${rk.sel.length==4?'':'disabled'}>✔ Comprobar</button>`}</div>${rk.done?`<div class=ok>${rk.truth.map((x,i)=>(rk.sel[i]!=null&&rk.items[rk.sel[i]].n==x.n?'✅':'❌')+' '+(i+1)+'º '+esc(x.n)).join(' · ')}</div>`:''}</div>`}

 ['📆 Diarios',[['dquiz','📆 Quiz diario 🪙'+(pd(dqPend)?' 🔴':'')],['dhol','📆 Higher/Lower diario 🪙'+(pd(dhPend)?' 🔴':'')],['daily','📅 GL Daily 🪙'+(pd(dlPend)?' 🔴':'')],['hangd','🪢 Ahorcado diario 🪙'+(pd(()=>hgdPend())?' 🔴':'')],['simond','🔴 Simón diario'+(localStorage.getItem('glx-simond:'+dlKey())?' ✓':' 🔴')],['snaked','🐍 Snake diario 🪙'+(pd(()=>skdPend())?' 🔴':'')]]],
 ['🎮 Libres',[['quiz','❓ Quiz libre'],['hol','⬆⬇ Higher or Lower'],['career','🏟 Modo carrera'],['memo','🧩 Memoria'],['react','🎯 Reflejos'],['who','🏆 ¿Quién ganó?'],['rank','📊 Ordena el ranking'],['snake','🐍 Snake libre'],['hang','🪢 Ahorcado libre'],['simon','🔴 Simón']]]];

TABS[16]='Fantasy';ICONS[16]='\u{1F9E0}';DESC[16]='Tu equipo, ligas privadas, mercado y clausulazos.';

const countUp=root=>root.querySelectorAll('.rec b,.sc').forEach(el=>{if(el.closest('.vivo')||el.children.length)return;const t=el.textContent.trim();if(!/^-?\d+([.,]\d+)?$/.test(t))return;const v=parseFloat(t.replace(',','.')),dec=(t.split(/[.,]/)[1]||'').length;if(!isFinite(v)||Math.abs(v)>1e7)return;const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/700),e=1-Math.pow(1-p,3);el.textContent=p<1?(v*e).toFixed(dec).replace('.',t.includes(',')?',':'.'):t;if(p<1)requestAnimationFrame(f)})(t0)});

 <div class=card><h2>${ico(c)} ${E(c.nombre)} · ${E(sNomT(T))}</h2><div class=grid><div class=rec><small>Participan</small><b>${nPart||R.length||'—'}</b></div><div class=rec><small>Partidas jugadas</small><b>${ids.length?(D.ids||[]).filter(id=>{const f=(D.by[id]||[])[0];return f&&f.competicion==c.id&&+f.temporada==T}).length:0}</b></div><div class=rec><small>Desempate</small><b style="font-size:15px">${({kills:'Más kills',vic:'Más victorias',kd:'Mejor K/D'})[c.desempate||'kills']}</b></div><div class=rec><small>Acceso</small><b style="font-size:14px">${E(q)}</b></div></div>

 <div class=card><h2>📊 Clasificación</h2>${R.length?table([['pos','Pos'],['n','Borrusher',1],['pj','PJ'],['pts','Puntos'],['kills','Kills'],['vic','Victorias']],R.slice(0,10),(x,i)=>i<3?'p'+(i+1):'')+zonasLegend(ZL)+`<div class=row style="margin-top:8px"><button class=bt onclick="cpFull()">Ver clasificación completa →</button></div>`:'<p style="color:var(--mu)">Todavía no hay partidas en esta competición y temporada.</p>'}</div>
 <div class=card><h2>📅 Próximos partidos</h2>${nx.length?nx.map(x=>`<div class=row><b>${E(x.fecha||'Fecha por definir')}${x.hora?' · '+E(x.hora):''}</b>${+x.jornada>0?`<span>J${E(x.jornada)}</span>`:''}${x.mapa?`<span>🗺 ${E(x.mapa)}</span>`:''}</div>`).join(''):'<p style="color:var(--mu)">No hay partidos programados.</p>'}</div>
 <div class=card><h2>🧾 Últimos resultados</h2>${ids.length?ids.map(id=>{const Q=(D.by[id]||[]).slice().sort((a,b)=>a.puesto-b.puesto),f=Q[0];return`<div class=match style="margin:6px 0"><small style="color:var(--mu)">J${E(f.jornada??'')} · ${E(f.fecha||'')}${f.mapa?' · 🗺 '+E(f.mapa):''}</small><div>${Q.slice(0,3).map((m,i)=>`<span style="margin-right:14px">${['🥇','🥈','🥉'][i]} ${E(m.jugador)} <small style="color:var(--mu)">${m.kills}K · ${m.puntos}pts</small></span>`).join('')}</div></div>`}).join(''):'<p style="color:var(--mu)">Aún no hay resultados.</p>'}</div>
 <div class=card><h2>🏛 Campeones de ${E(c.nombre)}</h2>${hist.length?hist.map(h=>`<div>🏆 <b>${E(sNomT(h.temporada))}</b>: ${E(h.campeon)}${h.eqCampeon?' · 🛡 '+E(h.eqCampeon):''}</div>`).join(''):'<p style="color:var(--mu)">Todavía no hay campeones registrados.</p>'}</div>`}
let rcT=null;window.rcSet=v=>{rcT=+v;draw()};
function recapPage(){const SS=[...new Set(seasons())].sort((a,b)=>b-a);if(!SS.length)return'<div class=card><h2>🏅 Resumen de temporada</h2><p style="color:var(--mu)">Aún no hay partidas.</p></div>';if(rcT==null||!SS.includes(rcT))rcT=SS[0];const T=rcT,R=stats(m=>m.temporada==T).filter(x=>x.pj),P=D.partidas.filter(m=>m.temporada==T),ids=new Set(P.map(m=>m.id));
 const top=(k,f=x=>true,lbl=v=>v)=>{const L=R.filter(f).sort((a,b)=>(b[k]-a[k])||(b.pts-a.pts));return L[0]&&L[0][k]>0?{n:L[0].n,v:lbl(L[0][k])}:null};
 const bm=P.reduce((b,m)=>!b||m.kills>b.kills?m:b,null),ch=(D.palmares||[]).filter(p=>+p.temporada==T);
 const T1=[['🥇','Líder en puntos',top('pts')],['⚔️','Máximo killer',top('kills')],['🏆','Más victorias',top('vic')],['🥉','Más podios',top('pod')],['🎯','Mejor K/D (3+ partidas)',top('kd',x=>x.pj>=3)],['📈','Más kills por partida (3+)',top('kpp',x=>x.pj>=3)],['🎮','Más partidas jugadas',top('pj')],['💥','Récord de kills en una partida',bm?{n:bm.jugador,v:bm.kills}:null]];
 return`<div class=card><h2>🏅 Resumen de temporada</h2><div class=row><select onchange="rcSet(this.value)">${SS.map(t=>`<option value="${t}" ${t==T?'selected':''}>${E(sNomT(t))}</option>`).join('')}</select></div>
 <div class=grid><div class=rec><small>Partidas</small><b>${ids.size}</b></div><div class=rec><small>Borrushers</small><b>${R.length}</b></div><div class=rec><small>Kills totales</small><b>${P.reduce((c,m)=>c+m.kills,0)}</b></div><div class=rec><small>Muertes totales</small><b>${P.reduce((c,m)=>c+m.muertes,0)}</b></div></div>
 ${ch.length?`<p style="margin:10px 0 0">${ch.map(c=>`🏆 <b>${E(COMPS[c.competicion]||c.competicion||'Liga')}</b>: ${E(c.campeon)}${c.eqCampeon?' · 🛡 '+E(c.eqCampeon):''}`).join('<br>')}</p>`:''}</div>
 <div class=card><h2>🎖 Premios de la temporada</h2><div class=grid>${T1.map(([ic,l,x])=>`<div class="rec glx2-pop"><small>${ic} ${l}</small><b style="font-size:17px">${x?E(x.n):'—'}</b><small style="color:var(--g2)">${x?E(x.v):''}</small></div>`).join('')}</div></div>
 <div class=card><h2>📊 Top 5</h2>${table([['pos','Pos'],['n','Borrusher',1],['pj','PJ'],['pts','Puntos'],['kills','Kills'],['vic','Victorias']],R.slice().sort(cmp('all')).map((x,i)=>({...x,pos:i+1})).slice(0,5),(x,i)=>i<3?'p'+(i+1):'')}</div>`}
const d9=draw;draw=function(){if(tab>=20&&tab<=23&&ok()){const a=$('#app');try{a.innerHTML=[cmpPage,tlPage,cpPage,recapPage][tab-20]()}catch(e){console.error(e);a.innerHTML='<div class=card>No se ha podido cargar esta sección.</div>'}return}return d9.apply(this,arguments)};
try{if(typeof buildNav=='function'&&ok())buildNav()}catch(e){}
})();
</script>
