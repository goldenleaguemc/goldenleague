<style>
:root{--bg:#121212;--card:#1d1d1d;--line:#333;--tx:#eee;--mu:#999;--g:#e0a912;--g2:#ffd966}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
header{padding:22px 16px 10px;text-align:center;background:linear-gradient(#2a2208,var(--bg))}
h1{margin:0;color:var(--g2);letter-spacing:2px;font-size:clamp(22px,5vw,38px)}header p{margin:4px;color:var(--mu)}.logo{display:block;margin:0 auto 6px;height:clamp(70px,16vw,110px);width:auto}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button,select{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--g);color:#000;border-color:var(--g);font-weight:700}
main{max-width:1100px;margin:auto;padding:12px}.demo{background:#5a1d1d;text-align:center;padding:6px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
h2{color:var(--g);margin:0 0 10px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.rec small{color:var(--mu)}.rec b{display:block;font-size:22px;color:var(--g2)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--g);cursor:pointer;position:sticky;top:0;background:var(--card)}td.l,th.l{text-align:left}
tr.p1 td{background:#3d3208}tr.p2 td{background:#2b2b2b}tr.p3 td{background:#3a2412}a{color:var(--g2);cursor:pointer;text-decoration:underline dotted}
.crest{width:1.6em;height:1.6em;margin-right:6px;vertical-align:-.45em}.crestbig{width:56px;height:56px;vertical-align:middle;margin-right:8px}.ic{width:1.3em;height:1.3em;object-fit:contain;vertical-align:-.25em;border-radius:4px}.bar{fill:var(--g)}svg text{fill:var(--mu);font-size:9px}.lg span{margin-right:12px;font-size:12px}details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer}
input{background:#111;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit}.k{width:72px;text-align:center}.bt{background:var(--g);color:#000;border:0;padding:8px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.bt.r{background:#a33;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.ok{background:#1d3d1d;text-align:center;padding:8px;border-radius:8px;margin:8px 0}
.match{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.match.vivo{border-color:#d33;box-shadow:0 0 0 1px #d33 inset}.mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-bottom:8px}.mb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.pt{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}.pt.r{flex-direction:row-reverse;text-align:right}.sc{font-size:clamp(24px,6vw,38px);font-weight:800;color:var(--g2);white-space:nowrap}.mn{text-align:center;color:var(--mu);font-size:13px;margin-top:6px}.st{font-weight:700;font-size:11px;padding:2px 8px;border-radius:99px;background:#333;color:#ccc}.st.vivo{background:#d33;color:#fff}.st.final{background:#1d3d1d;color:#9f9}.st.cancelada{background:#4a1d1d;color:#f99}.st.retrasada{background:#4a3a10;color:#fc6}.st.pendiente{background:#333;color:#ccc}.cx{opacity:.55}.cx td{text-decoration:line-through}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:5px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}.mw{color:var(--g2)}

.shell{display:flex;align-items:flex-start;max-width:1380px;margin:auto}.content{flex:1;min-width:0}
#side{width:220px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 8px;border-right:1px solid var(--line)}
#side nav{display:flex;flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;position:static;padding:0;gap:4px}
#side nav button{text-align:left;width:100%}
#menub{display:none}
#sbox{position:relative;max-width:520px;margin:10px auto 0;padding:0 12px;z-index:6}#sq{width:100%;padding:10px 12px;border-radius:8px}#sres{position:absolute;left:12px;right:12px;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow-y:auto;box-shadow:0 8px 24px #000a}#sres[hidden]{display:none}.sri{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.sri:hover{background:#2b2b2b}.sri small{color:var(--g);margin-right:6px}
@media(max-width:800px){.shell{display:block}#menub{display:block;position:sticky;top:0;z-index:7;width:100%;border-radius:0;padding:10px}
#side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:9;background:var(--bg);transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}}

/* ===== FX estilo Minecraft: partículas, títulos, actionbar, logros, barra de XP ===== */
body{padding-bottom:56px}
.logo{cursor:pointer;animation:fxbob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 10px #e0a91255)}@keyframes fxbob{50%{transform:translateY(-6px) rotate(-2deg)}}
.bt:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}.bt:disabled:hover{filter:grayscale(.6)}.bt:disabled:active{transform:none}
.bt,nav button{transition:transform .08s,filter .15s,box-shadow .15s}.bt{box-shadow:inset 0 -3px 0 #0005}.bt:hover,nav button:hover{filter:brightness(1.18)}.bt:active,nav button:active{transform:translateY(2px);box-shadow:none}
nav button:not(.on):hover{border-color:var(--g)}
.rec{transition:transform .15s,border-color .15s,box-shadow .15s}.rec:hover{transform:translateY(-2px);border-color:var(--g);box-shadow:0 4px 0 #0007}
tr.p1 td{background-image:linear-gradient(115deg,transparent 40%,#c88cff30 46%,#ffffff2a 50%,#c88cff30 54%,transparent 60%);background-size:400% 100%;animation:fxglint 4.5s linear infinite}@keyframes fxglint{from{background-position:100% 0}to{background-position:0 0}}
.match.vivo{animation:fxlive 1.6s ease-in-out infinite}@keyframes fxlive{50%{box-shadow:0 0 0 1px #d33 inset,0 0 18px #d3363a}}
.fx-in{animation:fxin .45s cubic-bezier(.2,.8,.3,1.1) both}@keyframes fxin{from{opacity:0;transform:translateY(14px) scale(.98)}}
.fx-shake{animation:fxsh .3s}@keyframes fxsh{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
.fx-cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.fx-dmg{position:fixed;inset:0;pointer-events:none;z-index:58;background:radial-gradient(transparent 45%,#c00b);opacity:0}.fx-dmg.on{animation:fxdmg .55s}@keyframes fxdmg{15%{opacity:1}}
.fx-title{position:fixed;left:0;right:0;top:28%;text-align:center;pointer-events:none;z-index:60;opacity:0;transition:opacity .35s;font-family:'Pixelify Sans',monospace;background:radial-gradient(ellipse 50% 50% at center,#000c,transparent 75%);padding:40px 16px}.fx-title.on{opacity:1}
.fx-title b{display:block;color:var(--g2);font-size:clamp(30px,8vw,64px);font-weight:700;line-height:1.1;text-shadow:4px 4px 0 #3a2c00;transform:scale(1.2);transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}.fx-title.on b{transform:none}
.fx-title span{display:block;margin-top:14px;color:#fff;font-size:clamp(16px,3vw,22px);line-height:1.4;text-shadow:2px 2px 0 #000}
.fx-ab{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 16px/1.4 'Pixelify Sans',monospace;color:#fff;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}.fx-ab.on{opacity:1}
.fx-xp{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(364px,62vw);height:8px;background:#000b;outline:1px solid #000;z-index:55;pointer-events:none}
.fx-xp i{display:block;height:100%;width:0;background:linear-gradient(#c6ff7a,#6fd12a 55%,#3d8a12);transition:width .15s}
.fx-xp::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/18 - 1px),#000a 0 calc(100%/18))}
.fx-xp b{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font:700 17px 'Pixelify Sans',monospace;color:#80ff20;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;pointer-events:auto;cursor:pointer;padding:4px 8px}.fx-xp b.pop{animation:fxpop .5s}@keyframes fxpop{40%{transform:translateX(-50%) scale(1.9)}}
.fx-mute{position:fixed;right:10px;bottom:6px;z-index:56;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:6px;width:34px;height:30px;cursor:pointer;font-size:15px;padding:0}
.fx-toast{position:fixed;top:12px;right:12px;z-index:70;display:flex;gap:10px;align-items:center;min-width:250px;max-width:calc(100vw - 24px);padding:10px 14px;background:#212121;border:2px solid #555;outline:2px solid #000;border-radius:4px;box-shadow:0 6px 18px #000a;transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}.fx-toast.on{transform:none}
.fx-toast i{font-style:normal;font-size:24px;width:40px;height:40px;flex:none;display:grid;place-items:center;background:#3a3a3a;border:2px solid #000;border-radius:3px}
.fx-toast small{display:block;font:700 13px/1.3 'Pixelify Sans',monospace;color:#ffff55;margin-bottom:6px}.fx-toast b{font:500 16px/1.3 'Pixelify Sans',monospace;color:#fff}
.fx-toast.ch{border-color:#a0a}.fx-toast.ch small{color:#ff55ff}
.fx-advs{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;background:#1b1b1b;border:2px solid #555;outline:2px solid #000;border-radius:4px;padding:12px;z-index:66;box-shadow:0 10px 30px #000c}.fx-advs[hidden]{display:none}
.fx-advs h3{margin:0 0 10px;font:700 17px/1.4 'Pixelify Sans',monospace;color:var(--g2)}.fx-adv{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #333}.fx-adv i{font-style:normal;font-size:20px;width:34px;height:34px;flex:none;display:grid;place-items:center;background:#3a3a3a;border:2px solid #000;border-radius:3px}.fx-adv.no{opacity:.4}.fx-adv.no i{filter:grayscale(1)}.fx-adv small{display:block;color:var(--mu)}
.fx-totem{position:fixed;left:50%;top:50%;width:170px;z-index:65;pointer-events:none;animation:fxtot 1.7s ease-out forwards}
@keyframes fxtot{0%{transform:translate(-50%,-50%) scale(.2) rotateY(0);opacity:0}25%{transform:translate(-50%,-50%) scale(1.4) rotateY(360deg);opacity:1}70%{opacity:1;transform:translate(-50%,-60%) scale(1.2) rotateY(720deg)}100%{opacity:0;transform:translate(-50%,-95%) scale(.6) rotateY(1080deg)}}
@media(prefers-reduced-motion:reduce){.logo,tr.p1 td,.match.vivo,.fx-in,.fx-shake{animation:none!important}}

.cp-in{animation:cpin .35s cubic-bezier(.2,.8,.3,1) both;transform-origin:top}@keyframes cpin{from{opacity:0;transform:translateY(-8px) scaleY(.96)}}
.pbar{transform-origin:left;animation:pbar .8s cubic-bezier(.2,.8,.3,1) both}@keyframes pbar{from{transform:scaleX(0)}}
tr.hl td{animation:hlrow 2.6s ease-out}@keyframes hlrow{0%,35%{background:#e0a91266}100%{background:transparent}}
.qtab tr{animation:fxin .4s both}.qtab tr:nth-child(2){animation-delay:0.05s}.qtab tr:nth-child(3){animation-delay:0.10s}.qtab tr:nth-child(4){animation-delay:0.15s}.qtab tr:nth-child(5){animation-delay:0.20s}.qtab tr:nth-child(6){animation-delay:0.25s}.qtab tr:nth-child(7){animation-delay:0.30s}.qtab tr:nth-child(8){animation-delay:0.35s}.qtab tr:nth-child(9){animation-delay:0.40s}.qtab tr:nth-child(10){animation-delay:0.45s}.qtab tr:nth-child(11){animation-delay:0.50s}.qtab tr:nth-child(12){animation-delay:0.55s}
.nx-btn{animation:nxglow 1.8s ease-in-out infinite}@keyframes nxglow{50%{box-shadow:0 0 0 3px #e0a91233,0 0 16px #e0a91288}}
.share-pop{animation:spop .3s cubic-bezier(.2,.8,.3,1.2) both}@keyframes spop{from{opacity:0;transform:scale(.85)}}
.toast-up{animation:tup .3s ease-out both}@keyframes tup{from{opacity:0;transform:translate(-50%,16px)}}
@media(prefers-reduced-motion:reduce){.cp-in,.pbar,tr.hl td,.qtab tr,.nx-btn,.share-pop,.toast-up{animation:none!important}}

.mchead{border-radius:6px;image-rendering:pixelated;vertical-align:middle;object-fit:cover;background:#0003}.mchead.av{position:relative;display:inline-flex;align-items:center;justify-content:center;background:#333;color:var(--g2);font-weight:700;overflow:hidden;flex:none}.mchead.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;background:#333}.mchead.ph{display:inline-flex;align-items:center;justify-content:center;background:#333;color:var(--g2);font-weight:700}
.grpod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.grpod>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.grpod b{display:block;font-size:22px;color:var(--g2)}.grpod small{color:var(--mu)}.grpod .g1{border-color:#e0a912;box-shadow:0 0 14px #e0a91244}
.gcard{position:relative;width:150px;height:220px;border-radius:14px;padding:8px;color:#fff;overflow:hidden;box-shadow:0 4px 14px #0008;display:flex;flex-direction:column;align-items:center;user-select:none}
.gcard .rt{position:absolute;left:10px;top:6px;line-height:1;text-align:center}.gcard .rt b{font-size:28px;display:block}.gcard .rt small{font-size:9px;letter-spacing:1px;opacity:.85}
.gcard .hd{margin-top:20px}.gcard .hd .mchead{border:3px solid #fff8;border-radius:10px}
.gcard .nm{margin-top:8px;font-weight:800;font-size:15px;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000a}.gcard .tm{font-size:10px;opacity:.85;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .st{display:flex;gap:10px;margin-top:auto;font-size:9px;text-align:center;opacity:.95}.gcard .st b{display:block;font-size:13px}
.gcard .rar{position:absolute;right:8px;top:8px;font-size:8px;font-weight:800;letter-spacing:1px;background:#0006;border-radius:6px;padding:2px 5px}
.gcard .cnt{position:absolute;right:8px;bottom:6px;font-weight:800;font-size:13px;background:#000a;border-radius:8px;padding:0 6px}
.rar-bronce{background:linear-gradient(160deg,#8a5a2b,#4a2e14);border:2px solid #cd7f32}.rar-plata{background:linear-gradient(160deg,#9aa7b3,#4b5560);border:2px solid #d8e0e8}.rar-oro{background:linear-gradient(160deg,#e8b923,#7a5a05);border:2px solid #ffd966}
.rar-leyenda{background:linear-gradient(160deg,#7b2ff7,#1a0b4d 55%,#f107a3);border:2px solid #ff9bf5;box-shadow:0 0 18px #c84bff99}
.rar-leyenda::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,#ffffff40 50%,transparent 60%);background-size:250% 100%;animation:cshine 2.6s linear infinite}@keyframes cshine{from{background-position:150% 0}to{background-position:-150% 0}}
.gcard.new::before{content:"NUEVA";position:absolute;left:0;bottom:30px;background:#e03c3c;font-size:10px;font-weight:800;padding:2px 8px;border-radius:0 8px 8px 0;z-index:2}
.gcard.lock{background:#161616;border:2px dashed #444;box-shadow:none;justify-content:center;color:#555}.gcard.lock .q{font-size:56px;font-weight:800}
.pkbox{position:relative;display:inline-block}.pkpack{width:130px;height:185px;border-radius:14px;background:linear-gradient(160deg,#ffd966,#e0a912 50%,#7a5a05);display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 0 24px #e0a91266}
.pkcount{position:absolute;right:-10px;top:-10px;background:#e03c3c;color:#fff;font-weight:800;border-radius:14px;padding:2px 9px}
.pkov{position:fixed;inset:0;background:#000e;z-index:99998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;overflow:auto}
.pkpack.shake{animation:pkshake .95s ease-in-out forwards}@keyframes pkshake{15%{transform:rotate(-8deg) scale(1.05)}30%{transform:rotate(8deg) scale(1.08)}45%{transform:rotate(-10deg) scale(1.1)}60%{transform:rotate(10deg) scale(1.12)}80%{transform:scale(1.25);filter:brightness(1.6)}100%{transform:scale(1.5);opacity:0}}
.pkrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.flip{perspective:900px;width:150px;height:220px;cursor:pointer}.fin{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.flip.on .fin{transform:rotateY(180deg)}
.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.fb.front{transform:rotateY(180deg)}
.fb.back{border-radius:14px;background:repeating-linear-gradient(45deg,#2a2208,#2a2208 8px,#3a2f0b 8px,#3a2f0b 16px);border:2px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:46px}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;justify-items:center}
@media(prefers-reduced-motion:reduce){.pkpack.shake,.rar-leyenda::after{animation:none!important}.fin{transition:none}}

.rar-rubi{background:linear-gradient(160deg,#e0315b,#5a0a22);border:2px solid #ff8aa5;box-shadow:0 0 12px #e0315b66}
.rar-diamante{background:linear-gradient(160deg,#7fe9ff,#1b5f8a 60%,#0b2a4a);border:2px solid #c9f6ff;box-shadow:0 0 18px #5ad7ff99}
.rar-especial{background:linear-gradient(160deg,#15110a,#3a2a00 45%,#e0a912 140%);border:2px solid #ffd966;box-shadow:0 0 20px #ffd96699}
.rar-diamante::after,.rar-especial::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,#ffffff40 50%,transparent 60%);background-size:250% 100%;animation:cshine 2.6s linear infinite}
.gcard,.flip{height:232px}.gcard .st{background:none;padding:0;border-radius:0}
.gcard .slb{margin-top:5px;font-size:10px;line-height:1.15;font-weight:800;letter-spacing:.3px;color:#ffd966;max-width:100%;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 2px #000}
.simc{cursor:pointer;border-radius:16px;transition:transform .1s,opacity .15s}.simc:not(.on){opacity:.8}.simc.on{outline:3px solid #80ff20;transform:translateY(-4px)}
@media(prefers-reduced-motion:reduce){.rar-diamante::after,.rar-especial::after{animation:none!important}}

/* avisos (título, fuegos, logros) siempre por encima del overlay de sobres (z-index 99998) */
.fx-cv{z-index:100000}.fx-dmg{z-index:100001}.fx-title{z-index:100002;top:18%}.fx-ab{z-index:100002}.fx-totem{z-index:100002}.fx-toast{z-index:100003}.fx-advs{z-index:100003}.fx-xp,.fx-mute{z-index:100001}
.gcard.cust::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:12px;box-shadow:inset 0 0 0 1px #ffffff55}
.qzo{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;background:var(--card);color:var(--tx);border:1px solid var(--line);font:inherit;cursor:pointer}.qzo:hover:not(:disabled){border-color:var(--g)}.qzo.ok{background:#1f5d2a;border-color:#3fbf5a}.qzo.ko{background:#5a1d1d;border-color:#e06666}.qzo:disabled{cursor:default}
.dlc{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);margin:2px;font-size:13px}.dlc.ok{border-color:#3fbf5a;color:#9f9}.dlc.ko{border-color:#e06666;color:#f99}
.hol-arena{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:12px 0}
@media(max-width:640px){.hol-arena{grid-template-columns:1fr;}.hol-vs{margin:-4px auto!important}}
.hlc{position:relative;border:2px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;background:linear-gradient(160deg,#262626,#161616);min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.hlc.p{border-color:#6fa8dc66}.hlc.t{border-color:#93c47d66}.hlc.a{border-color:#e0a91299}.hlc.x{border-color:#c27ba099}
.hlc .hi{height:92px;display:flex;align-items:center;justify-content:center;font-size:56px}
.hlc .hi img{max-height:92px;max-width:120px;object-fit:contain;border-radius:10px}
.hlc .hn{font-size:20px;font-weight:800;line-height:1.15;word-break:break-word}.hlc .hs{color:var(--mu);font-size:12px}
.hlc .hl{color:var(--mu);font-size:13px;margin-top:6px}.hlc .hv{font-size:44px;font-weight:900;color:var(--g2);line-height:1.05;font-variant-numeric:tabular-nums}
.hlc .hv.q{color:var(--mu)}.hlc.win{border-color:#3fbf5a;box-shadow:0 0 22px #3fbf5a55}.hlc.lose{border-color:#e06666;box-shadow:0 0 22px #e0666655}
.hol-vs{align-self:center;background:var(--g);color:#000;font-weight:900;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
.hol-btns{display:flex;gap:10px;margin-top:10px}.hol-btns button{flex:1;font-size:18px;padding:14px}
.hol-btns .lo{background:#6fa8dc}.hol-ed{border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;background:#161616}
.hol-ed.off{opacity:.55}.hol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:6px}.hol-grid label{font-size:12px;color:var(--mu)}.hol-grid input{width:100%}

/* ===== VALORACIÓN (62-99): borrushers, borrusquads y borrunations =====

   kills 37%, K/D (kills y muertes) 37%, victoria 12%, puesto 8% y puntos 6%. Borrusquads / Borrunations: media por jugador (tener más jugadores no da ventaja).
   La valoración sale de la MEDIA de esas notas, comparada con la media de todos los demás: la media del grupo siempre cae en 76 y cada uno queda por encima
   o por debajo según lo lejos que esté de esa media. Pesa sobre todo el RENDIMIENTO ACTUAL: los últimos encuentros pesan mucho más (la mitad cada 6 partidas),

  if(kind=='p')E=rows.map(m=>({n:m.jugador,v:-m.puesto,k:m.kills,d:m.muertes,pt:m.puntos}));
  else{const g={};rows.forEach(m=>{let k=null;if(kind=='t'){if(cfg(c).equipos===false)return;const q=teamOf(m.jugador,m.temporada);if(q&&teamInComp(q,c,m.temporada))k=q}else k=profile(m.jugador).nacionalidad||null;if(!k)return;const o=g[k]??={n:k,pt:0,k:0,d:0,c:0};o.pt+=m.puntos;o.k+=m.kills;o.d+=m.muertes;o.c++});E=Object.values(g).map(o=>({n:o.n,v:o.pt/o.c*1000+o.k/o.c,k:o.k/o.c,d:o.d/o.c,pt:o.pt/o.c}))}
  if(E.length<2)return;const N=E.length,mk=Math.max(1,...E.map(e=>e.k));
  const rk=f=>E.map(e=>{let sc=0;E.forEach(o=>{if(o!==e){const a=f(e),b=f(o);sc+=a>b?1:a<b?0:.5}});return sc/(N-1)*100}),PL=rk(e=>e.v),KD=rk(e=>e.k/(e.d+1)),PR=rk(e=>e.pt),W=VAL.W;

 if(k=='tpts'){L=tstats(fn,'all').filter(x=>x.ap).sort((a,b)=>b.pts-a.pts||b.kills-a.kills).map(x=>({n:x.n,d:x.pts+' pts'}));return}
 const R=stats(fn,'all').filter(x=>x.pj);
 if(k=='pts')L=R.slice().sort((a,b)=>b.pts-a.pts||b.kills-a.kills).map(x=>({n:x.n,d:x.pts+' pts · '+x.kills+' kills'}));
 else if(k=='vic')L=R.filter(x=>x.vic>0).sort((a,b)=>b.vic-a.vic||b.pts-a.pts).map(x=>({n:x.n,d:x.vic+' victoria(s)'}));
 else if(k=='rv')L=R.filter(x=>x.rv>=gcRule('rv').rm).sort((a,b)=>b.rv-a.rv||b.pts-a.pts).map(x=>({n:x.n,d:'racha de '+x.rv}));
 else if(k=='rev'&&T>1)L=R.filter(r=>r.pj>=3).map(r=>({n:r.n,d:(eloOf('p',r.n,T)??NaN)-(eloOf('p',r.n,T-1)??NaN)})).filter(r=>isFinite(r.d)&&r.d>0).sort((a,b)=>b.d-a.d).map(x=>({n:x.n,d:'+'+x.d+' de valoración'}))})}catch(e){L=[]}GAC[key]=L;return L}

/* ===== COPIAS DE SEGURIDAD AUTOMÁTICAS (cada 1 minuto) ===== */
const BK={ms:60000,max:120,db:null,last:'',on:true,list:[],msg:''};
BK.open=()=>new Promise((ok,ko)=>{if(BK.db)return ok(BK.db);const r=indexedDB.open('golden-backups',1);r.onupgradeneeded=()=>r.result.createObjectStore('b',{keyPath:'t'});r.onsuccess=()=>{BK.db=r.result;ok(BK.db)};r.onerror=()=>ko(r.error)});
BK.tx=async(m,f)=>{const db=await BK.open();return new Promise((ok,ko)=>{const t=db.transaction('b',m),s=t.objectStore('b'),q=f(s);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})};
BK.all=async()=>(await BK.tx('readonly',s=>s.getAll())||[]).sort((a,b)=>b.t-a.t);
BK.run=async(force)=>{
 if(!BK.on&&!force)return;
 try{
  let o=null;
  try{const r=await fetch('/api/data',{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&d.partidas)o=d}}catch(e){}
  if(!o&&typeof D!=='undefined'&&D&&D.partidas&&!D.demo)o=payload();
  if(!o)return;
  const j=JSON.stringify(o);
  if(j===BK.last&&!force)return;
  BK.last=j;
  await BK.tx('readwrite',s=>s.put({t:Date.now(),n:o.partidas.length,j:o.jugadores.length,json:j}));
  const l=await BK.all();
  if(l.length>BK.max)await BK.tx('readwrite',s=>{l.slice(BK.max).forEach(x=>s.delete(x.t))});
  BK.msg='✅ Última copia: '+new Date().toLocaleTimeString();
 }catch(e){BK.msg='❌ No se pudo crear la copia'}
 BK.paint();
};
BK.fmt=t=>new Date(t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
BK.paint=async()=>{const el=document.getElementById('bkbox');if(!el)return;
 BK.list=await BK.all().catch(()=>[]);
 el.innerHTML=`<h2>🛟 Copias de seguridad automáticas</h2><div class=row><label><input type=checkbox ${BK.on?'checked':''} onchange="BK.on=this.checked;BK.paint()"> Copia automática cada minuto (si hay cambios)</label><button class=bt onclick="BK.run(true)">Copia ahora</button><button class=bt onclick="BK.dlAll()">Descargar todas</button><button class="bt r" onclick="BK.clear()">Vaciar copias</button></div><p style="color:var(--mu);margin:4px 0">${BK.msg} · Se guardan las últimas ${BK.max} en este navegador. Funciona mientras la pestaña esté abierta con la sesión de Admin iniciada.</p><div class=w style="max-height:260px;overflow:auto"><table><tr><th class=l>Fecha</th><th>Partidas</th><th>Borrushers</th><th>Tamaño</th><th></th></tr>${BK.list.slice(0,40).map(x=>`<tr><td class=l>${BK.fmt(x.t)}</td><td>${x.n}</td><td>${x.j}</td><td>${(x.json.length/1024).toFixed(0)} KB</td><td><button class=bt onclick="BK.dl(${x.t})">Descargar</button> <button class="bt r" onclick="BK.restore(${x.t})">Restaurar</button></td></tr>`).join('')||'<tr><td colspan=5>Aún no hay copias</td></tr>'}</table></div>`};
BK.dl=t=>{const x=BK.list.find(b=>b.t==t);if(!x)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x.json],{type:'application/json'}));a.download='backup-'+new Date(t).toISOString().replace(/[:.]/g,'-')+'.json';a.click()};
BK.dlAll=()=>{if(!BK.list.length)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(BK.list.map(x=>({fecha:new Date(x.t).toISOString(),datos:JSON.parse(x.json)})))],{type:'application/json'}));a.download='backups-golden-league.json';a.click()};
BK.clear=async()=>{if(confirm('¿Borrar todas las copias guardadas en este navegador?')){await BK.tx('readwrite',s=>s.clear());BK.last='';BK.msg='Copias vaciadas';BK.paint()}};
BK.restore=t=>{const x=BK.list.find(b=>b.t==t);if(!x||!confirm('¿Restaurar la copia del '+BK.fmt(t)+'? Se sustituirán los datos actuales (antes se hace una copia del estado actual).'))return;
 BK.run(true).then(()=>{D=JSON.parse(x.json);save('Copia del '+BK.fmt(t)+' restaurada')})};
(()=>{const v=view6;view6=function(a){v(a);if(adm){const d=document.createElement('div');d.className='card';d.id='bkbox';a.appendChild(d);BK.paint()}}})();
setInterval(()=>{if(typeof adm!=='undefined'&&adm)BK.run()},BK.ms);

 if(S.over&&!a&&S.empty)return`<div class=card><h2>⬆⬇ Higher or Lower</h2><p style="${mu}">No hay suficientes cartas con valores distintos para jugar con estos filtros. Prueba con otra categoría, estadística o temporada.</p><div class=row><button class=bt onclick="hol=null;draw()">Volver</button></div></div>`;
 return`<div class=card><div class=row><b>${HLC[S.cat]} · ${esc(hlLbl(S.cat,S.m))}</b><span>🔥 ${S.streak}</span><span style="margin-left:auto;color:var(--mu)">🏅 Récord ${R.best||0}</span></div>
 <h2 style="font-size:18px;color:var(--tx);margin-top:10px">${S.over?(S.won?'🏆 ¡Te has quedado sin cartas nuevas!':'❌ Has fallado'):`¿<b>${esc(S.r.name)}</b> tiene más o menos ${esc(hlLbl(S.cat,S.m).toLowerCase())} que <b>${esc(S.l.name)}</b>?`}</h2>
 <div class=hol-arena>${holCard(S.l,false)}<div class=hol-vs>VS</div>${holCard(S.r,!a,a?(S.ok?'win':'lose'):'')}</div>
 ${a?`<p style="margin:6px 0">${S.ok?'✅ <b>¡Correcto!</b>':'❌ <b>Fallaste.</b>'} ${esc(S.r.name)}: <b>${hlFmt(hlVal(S.r,S.m),S.m)}</b> frente a ${hlFmt(hlVal(S.l,S.m),S.m)} de ${esc(S.l.name)}.</p>`:`<div class=hol-btns><button class=bt onclick="holPick(1)">⬆ Más</button><button class="bt lo" onclick="holPick(-1)">⬇ Menos</button></div>`}
 ${S.over?`<p style="font-size:18px;margin:10px 0 6px"><b style="color:var(--g2)">${S.streak}</b> acierto(s) seguidos</p>${S.newRec?`<p style="margin:0 0 8px">🎉 <b>¡Nuevo récord!</b> (antes ${S.prev})${S.reward?' Has ganado <b>+1 sobre</b> 🎴':''}</p>`:''}<div class=row><button class=bt onclick="holStart()">🔁 Jugar otra vez</button><button class=bt onclick="hol=null;draw()">Cambiar ajustes</button></div>`:''}</div>`}

/* ---------- Admin: editar, ocultar y crear cartas del Higher or Lower ---------- */
function adminHL(){const C=hlCfg(),E=holEd,q=cgNorm(E.q),all=hlDeck(E.cat,'all',true).filter(c=>!q||cgNorm(c.name).includes(q)),L=all.slice(0,E.n),M=hlMets(E.cat,'all'),
 fld=(id,l,v,w)=>`<label style="font-size:12px;color:var(--mu)">${l}<br><input id="${id}" value="${esc(v??'')}" style="width:${w||150}px"></label>`,
 vals=(pre,v)=>`<div class=hol-grid>${M.map(([k,l])=>`<label>${l}<input id="${pre}_${k}" type=number step=any value="${v&&v[k]!=null?esc(v[k]):''}" placeholder="auto"></label>`).join('')}</div>`,
 ed=E.form;
 return`<div class=card id=holform><h2>⬆⬇ Higher or Lower · editar cartas</h2><p style="color:var(--mu);margin:0 0 8px;font-size:13px">Cada carta sale sola de los datos de la liga. Aquí puedes cambiar su nombre, icono, imagen y los valores que se muestran <b>solo en este juego</b> (dejar un valor vacío = el real de la liga), ocultarla del juego o crear cartas nuevas.</p>
 <div class=row>Categoría ${sel('hle_c',Object.entries(HLC),E.cat,'hlEC')} Buscar <input value="${esc(E.q)}" placeholder="Nombre…" onchange="holEd.q=this.value;holEd.n=30;draw()" style="width:150px"><button class=bt onclick="hlEdit('new')">➕ Nueva carta</button></div>
 ${ed?`<div class=hol-ed><b>${ed.id=='new'?'➕ Nueva carta':'✏ Editando: '+esc(ed.base||ed.name)}</b><div class=row>${fld('hle_n','Nombre',ed.name,170)}${fld('hle_i','Icono (emoji)',ed.ic,80)}${fld('hle_s','Subtítulo',ed.sub,170)}${fld('hle_m','Imagen (URL data:image…)',ed.img,200)}</div>${vals('hle_v',ed.v)}<div class=row><button class=bt onclick="hlSave()">💾 Guardar</button><button class=bt onclick="holEd.form=null;draw()">Cancelar</button></div></div>`:''}
 <p style="color:var(--mu);font-size:12px;margin:8px 0 0">${all.length} carta(s) · las que tienen 👁‍🗨 están ocultas del juego</p>
 ${L.map(c=>`<div class="hol-ed ${c.off?'off':''}"><div class=row><span style="font-size:22px;min-width:30px;text-align:center">${c.img&&isImg(c.img)?'🖼':esc(c.ic||(c.cat=='a'?'🏟':c.cat=='t'?'🛡':'👤'))}</span><b>${esc(c.name)}</b><small style="color:var(--mu)">${esc(c.sub||'')} ${c.custom?'· personalizada':c.edited?'· editada':''} · ${M.map(([k,l])=>hlVal(c,k)!==null?l+' '+hlFmt(hlVal(c,k),k):'').filter(Boolean).slice(0,3).join(' · ')}</small><span style="margin-left:auto"></span><button class=bt onclick="hlEdit('${esc(c.id).replace(/'/g,"\\'")}')">✏ Editar</button><button class=bt onclick="hlOff('${esc(c.id).replace(/'/g,"\\'")}')">${c.off?'👁 Mostrar':'🚫 Ocultar'}</button>${c.custom?`<button class="bt r" onclick="hlDel('${esc(c.id).replace(/'/g,"\\'")}')">Borrar</button>`:c.edited?`<button class="bt r" onclick="hlReset('${esc(c.id).replace(/'/g,"\\'")}')">↺ Restaurar</button>`:''}</div></div>`).join('')||'<p style="color:var(--mu)">No hay cartas.</p>'}
 ${all.length>E.n?`<div class=row><button class=bt onclick="holEd.n+=30;draw()">Mostrar más (${all.length-E.n})</button></div>`:''}</div>`}
const hlEC=v=>{holEd.cat=v;holEd.n=30;holEd.form=null;draw()};
function hlEdit(id){const E=holEd;if(id=='new'){E.form={id:'new',name:'',ic:'⭐',sub:'',img:'',v:{}}}else{const c=hlDeck(E.cat,'all',true).find(x=>x.id==id);if(!c)return;const o=hlCfg().over[id]||{},cu=c.custom?hlCfg().cards.find(x=>'x|'+x.id==id):null;E.form={id,base:c.name,name:c.name,ic:c.ic,sub:c.sub,img:c.img,v:c.custom?(cu&&cu.v)||{}:(o.v||{})}}draw();setTimeout(()=>{const e=$('#holform');if(e)e.scrollIntoView({behavior:'smooth'})},60)}
function hlSave(){const E=holEd,F=E.form,C=hlCfg(),name=($('#hle_n').value||'').trim();if(!name)return alert('Escribe un nombre');const ic=($('#hle_i').value||'').trim(),sub=($('#hle_s').value||'').trim(),img=($('#hle_m').value||'').trim(),v={};
 hlMets(E.cat,'all').forEach(([k])=>{const e=$('#hle_v_'+k);if(e&&e.value!==''&&isFinite(+e.value))v[k]=+e.value});
 if(img&&!isImg(img))return alert('La imagen debe ser una imagen incrustada (data:image/…). Déjalo vacío para usar el icono.');
 if(F.id=='new')C.cards.push({id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),cat:E.cat,name,ic,sub,img,v});
 else if(F.id.startsWith('x|')){const c=C.cards.find(x=>'x|'+x.id==F.id);if(c)Object.assign(c,{name,ic,sub,img,v})}
 else{const base=hlBase(E.cat,'all').find(x=>x.id==F.id),o=C.over[F.id]=C.over[F.id]||{};o.name=name==(base&&base.name)?'':name;o.ic=ic;o.sub=sub;o.img=img;o.v=v}
 E.form=null;save('Carta «'+name+'» guardada (Higher or Lower)')}
function hlOff(id){const C=hlCfg();if(id.startsWith('x|')){const c=C.cards.find(x=>'x|'+x.id==id);if(c)c.off=!c.off}else{const o=C.over[id]=C.over[id]||{};o.off=!o.off}save('Carta actualizada')}
function hlDel(id){if(!confirm('¿Borrar esta carta?'))return;const C=hlCfg();C.cards=C.cards.filter(x=>'x|'+x.id!=id);save('Carta borrada')}
function hlReset(id){if(!confirm('¿Restaurar los valores reales de esta carta?'))return;delete hlCfg().over[id];save('Carta restaurada')}
/* ---------- Admin: colecciones de los usuarios (ver, dar y quitar cartas) ---------- */
let usrSel='',usrT=null,usrQ='',usrMsg='';
/* Proyección: si el usuario aún no se ha sincronizado, se calcula lo que tendría según las órdenes del admin */
function usrProj(nick,T){const nk=nrm(nick),ow={};if(!nk)return ow;(D.cartasAdmin||[]).forEach(o=>{const me=o.nick=='*'?o.tipo=='quitar':nrm(o.nick)==nk;if(!me)return;
 if(o.tipo=='resetall'||(o.tipo=='reset'&&(+o.temp||T)==T)){Object.keys(ow).forEach(k=>delete ow[k])}
 else if(o.tipo=='carta'&&(+o.temp||T)==T)ow[o.card]=(ow[o.card]||0)+Math.max(1,+o.n||1);
 else if(o.tipo=='quitar'&&(+o.temp||T)==T){if(+o.n>0){ow[o.card]=Math.max(0,(ow[o.card]||0)-o.n);if(!ow[o.card])delete ow[o.card]}else delete ow[o.card]}});return ow}
const usrNicks=()=>[...new Set([...Object.keys((D.quiniela||{})[GCSYNC]||{}),...Object.values(D.quiniela||{}).flatMap(o=>Object.keys(o||{})),...(D.cartasAdmin||[]).map(o=>o.nick)].filter(n=>n&&n!='*'&&n[0]!='_'||n=='_adm'))].sort((a,b)=>a.localeCompare(b,'es'));
function adminUsers(){const T=usrT||curS(),nicks=usrNicks(),raw=((D.quiniela||{})[GCSYNC]||{})[usrSel],sn=raw?gcDec(raw):null,nk=nrm(usrSel),
 deck=gcDeck(T),byId={};deck.forEach(c=>byId[c.id]=c);const own=sn&&sn.s&&sn.s[T]?sn.s[T]:(sn?{}:usrProj(usrSel,T)),ids=Object.keys(own).sort((a,b)=>(byId[a]?TW[byId[a].tier]:9)-(byId[b]?TW[byId[b].tier]:9)||(byId[b]?byId[b].r:0)-(byId[a]?byId[a].r:0)),
 tot=ids.reduce((c,k)=>c+own[k],0),q=cgNorm(usrQ),opts=deck.filter(c=>!c.del&&(!q||cgNorm(c.name+' '+(c.label||'')).includes(q))).slice(0,300),
 rmOpts=[...deck.filter(c=>own[c.id]),...deck.filter(c=>!own[c.id]&&!c.del)].filter(c=>!q||cgNorm(c.name+' '+(c.label||'')).includes(q)).slice(0,400),
 ords=(D.cartasAdmin||[]).filter(o=>nk&&nrm(o.nick)==nk).slice().reverse().slice(0,12),applied=new Set((sn&&sn.a)||[]),
 ce=id=>String(id).replace(/'/g,"\\'");
 return`<div class=card id=usrform><h2>👥 Colecciones de usuarios</h2><p style="color:var(--mu);margin:0 0 8px;font-size:13px">Elige un usuario (quien abre sobres con su nombre en «Juegos») para ver sus cartas y darle o quitarle. Su colección se actualiza cuando abre «Juegos»; los cambios que hagas se le aplican la próxima vez que lo abra.</p>
 <div class=row>Usuario <input list=usr_l value="${esc(usrSel)}" placeholder="Nombre" style="width:170px" onchange="usrSel=this.value.trim();draw()"><datalist id=usr_l>${nicks.map(n=>`<option value="${esc(n)}">`).join('')}</datalist> Temporada ${sel('usrt',allS().slice().reverse().map(t=>[t,'Temporada '+t]),T,'usrST')}<button class=bt onclick="usrRefresh()">🔄 Actualizar</button></div>
 ${usrMsg?`<p style="margin:6px 0;color:var(--g2)">${esc(usrMsg)}</p>`:''}
 ${!usrSel?`<p style="color:var(--mu)">Escribe o elige un usuario. Con sincronizados: ${Object.keys((D.quiniela||{})[GCSYNC]||{}).map(esc).join(', ')||'<i>ninguno todavía (se sincronizan cuando abren «Juegos»)</i>'}.</p>`:
 `<div class=row><b style="color:var(--g2)">${esc(usrSel)}</b>${sn?`<span>🎁 Sobres: ${sn.p}</span><span>📦 Abiertos: ${sn.o}</span><span>🃏 T${T}: ${tot} cartas (${ids.length} distintas)</span><small style="color:var(--mu)">última sincronización ${sn.ts?new Date(sn.ts).toLocaleString('es-ES'):'?'}</small>`:`<span style="color:#f99">Sin sincronizar: aún no ha abierto «Juegos» con esta versión. Puedes darle cartas igualmente.</span>`}</div>
 <div class=row>Dar sobres <input id=us_p class=k type=number min=1 value=1><button class=bt onclick="usrOrd({tipo:'sobres',n:Math.max(1,+$('#us_p').value||1)},'sobres')">🎁 Dar</button></div>
 <div class=row>Dar carta de T${T} <input value="${esc(usrQ)}" placeholder="Buscar…" style="width:130px" onchange="usrQ=this.value;draw()"><select id=us_c style="max-width:320px">${opts.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} · ${c.special?esc(c.label||'Especial'):TIER[c.tier]} · ${c.r}${c.ver>1?' V'+c.ver:''}${c.retired?' (antigua)':''}</option>`).join('')||'<option value="">(sin resultados)</option>'}</select> Cant. <input id=us_q class=k type=number min=1 value=1><button class=bt onclick="usrGive()">🃏 Dar</button></div>
 <div class=row>Quitar carta de T${T} <select id=us_r style="max-width:320px">${rmOpts.map(c=>`<option value="${esc(c.id)}">${own[c.id]?'✅ ×'+own[c.id]+' · ':''}${esc(c.name)} · ${c.special?esc(c.label||'Especial'):TIER[c.tier]} · ${c.r}${c.ver>1?' V'+c.ver:''}${c.retired?' (antigua)':''}</option>`).join('')||'<option value="">(sin resultados)</option>'}</select> Cant. <input id=us_rq class=k type=number min=1 value=1><button class="bt r" onclick="usrTakeSel(false)">🗑 Quitar</button><button class="bt r" onclick="usrTakeSel(true)">🗑 Todas</button></div>
 ${!sn&&ids.length?`<p style="color:var(--mu);margin:8px 0 0;font-size:13px">Cartas según las órdenes pendientes (aún no se ha sincronizado, puede tener más):</p>`:''}
 <div class=pkgrid style="margin-top:12px">${ids.map(id=>{const c=byId[id];return`<div style="text-align:center">${c?gCard(c,{count:own[id]}):`<div class="gcard lock"><div class=q>?</div><div class=tm>${esc(id)}</div></div>`}<div style="font-size:12px;color:var(--mu);margin:4px 0">×${own[id]}${c&&c.retired?' · antigua':''}</div><div class=row style="justify-content:center"><button class=bt onclick="usrGive('${ce(id)}',1)">➕</button><button class=bt onclick="usrTake('${ce(id)}',1)">➖</button><button class="bt r" onclick="usrTake('${ce(id)}',0)">🗑 Todas</button></div></div>`}).join('')||`<p style="color:var(--mu)">${sn?'No tiene cartas en esta temporada.':''}</p>`}</div>
 ${ords.length?`<h3 style="color:var(--g);margin:14px 0 6px;font-size:15px">Últimas órdenes para ${esc(usrSel)}</h3>${ords.map(o=>`<div class=row><small style="color:var(--mu)">${new Date(o.t).toLocaleString('es-ES')}</small> ${lblO(o)} ${applied.has(o.id)?'<span style="color:#9f9">✅ aplicada</span>':'<span style="color:#fc6">⏳ pendiente</span>'}</div>`).join('')}`:''}`}</div>`}
const lblO=o=>o.tipo=='quitar'?`🗑 Quitada${+o.n>0?' '+o.n+'×':''} ${esc(o.cardName||o.card)} (T${o.temp})`:o.tipo=='carta'?`🃏 ${o.n}× ${esc(o.cardName||'carta')} (T${o.temp})`:o.tipo=='sobres'?`🎁 +${o.n} sobre(s)`:o.tipo=='reset'?`↺ Reinicio T${o.temp}`:'↺ Reinicio total',
 usrST=v=>{usrT=+v;draw()};
async function usrRefresh(){usrMsg='Actualizando…';draw();await gcFresh();usrMsg='Actualizado';draw();setTimeout(()=>{usrMsg='';},50)}
function usrOrd(o,txt){if(!usrSel)return alert('Elige un usuario');(D.cartasAdmin??=[]).push({id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),nick:usrSel,t:Date.now(),...o});usrMsg='';save('Orden para '+usrSel+': '+txt)}
function usrGive(id,n){if(!usrSel)return alert('Elige un usuario');const T=usrT||curS();id=id||($('#us_c')||{}).value;if(!id)return alert('Elige una carta');n=n||Math.max(1,+$('#us_q').value||1);const c=gcDeck(T).find(x=>x.id==id);usrOrd({tipo:'carta',card:id,n,temp:T,cardName:(c?c.name+(c.ver>1?' V'+c.ver:'')+' · '+(c.special?c.label:TIER[c.tier]):id)},'+'+n+' '+(c?c.name:id))}
function usrTakeSel(all){const id=($('#us_r')||{}).value;if(!id)return alert('Elige una carta');usrTake(id,all?0:Math.max(1,+$('#us_rq').value||1))}
function usrTake(id,n){const T=usrT||curS(),c=gcDeck(T).find(x=>x.id==id);if(!n&&!confirm('¿Quitar TODAS las copias de esta carta a '+usrSel+'?'))return;usrOrd({tipo:'quitar',card:id,n,temp:T,cardName:c?c.name+(c.ver>1?' V'+c.ver:''):id},(n?'-'+n:'quitar todas')+' '+(c?c.name:id))}
</script></body></html>
